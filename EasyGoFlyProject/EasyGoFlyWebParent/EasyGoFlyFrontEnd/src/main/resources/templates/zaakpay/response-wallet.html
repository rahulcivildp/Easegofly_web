<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<head th:replace="fragments :: page_head(': Response', 'tag')"></head>
<link rel="stylesheet" type="text/css" th:href="@{/css/zaakpay.css}" >
<link href='https://fonts.googleapis.com/css?family=Libre Barcode 39' rel='stylesheet'>
<style type="text/css">
*.specialButtonRed {
	background-color: #cf5b4a;
	color: white;
	cursor: pointer;
	width: auto;
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 600;
    box-shadow: rgb(100 100 111 / 20%) 0px 7px 29px 0px;
	  -webkit-transition: background-color 2s ease-out;
	  -moz-transition: background-color 2s ease-out;
	  -o-transition: background-color 2s ease-out;
	  transition: background-color 2s ease-out;
	  -webkit-transition: color 0.5s ease-out;
	  -moz-transition: color 0.5s ease-out;
	  -o-transition: color 0.5s ease-out;
	  transition: color 0.5s ease-out;
}
*.specialButtonRed:hover {
	background-color: #fdf4f2;
	color: #2c2c2ceb;
    border: 1px solid #cf5b4a;
}
</style>
</head>
<body>

  <header id="header" class="fixed-top d-flex align-items-center" >
  	<div th:replace="fragments :: page_header('tag')"></div>
  </header>

  <!-- Vendor JS Files -->
  <script type="text/javascript" th:src="@{../assets/vendor/purecounter/purecounter_vanilla.js}"></script>
  <script type="text/javascript" th:src="@{../assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script type="text/javascript" th:src="@{../assets/vendor/glightbox/js/glightbox.min.js}"></script>
  <script type="text/javascript" th:src="@{../assets/vendor/isotope-layout/isotope.pkgd.min.js}"></script>
  <script type="text/javascript" th:src="@{../assets/vendor/swiper/swiper-bundle.min.js}"></script>
  <script type="text/javascript" th:src="@{../assets/vendor/php-email-form/validate.js}"></script>

  <!-- Template Main JS File -->
  <script type="text/javascript" src="../assets/js/main.js"></script>
  
  <div th:replace="whatsapp :: content"></div>
<br><br>
<br><br>
<br><br>
<div align="center">
    <table width="500px;" class="customtable-all card">
    <th:block th:if="${!verifyChecksum}">
	Name = [[${customer.firstName}]] [[${customer.lastName}]]<br>
    <tr>
        <td width="50%" align="center" valign="middle">responseCode</td>
        <td width="50%" align="center" valign="middle"><font color=Red>***</font></td>
    </tr>
    <tr>
        <td width="50%" align="center" valign="middle">responseDescription</td>
        <td width="50%" align="center" valign="middle"><font color=Red>This response is compromised.</font></td>
    </tr>
    </th:block>
    <th:block th:if="${verifyChecksum}">
	    <tr th:if="${paymentCancelled}">
	    	<td width="50%" align="center" valign="middle">Payment Status</td>
	    	<td width="50%" align="center" valign="middle" bgcolor="red">[[${paymentCancelled}]] </td>
	    </tr>
	    <tr th:if="${paymentCancelled} == null">
	    	<td width="50%" align="center" valign="middle">Payment Status</td>
	    	<td width="50%" align="center" valign="middle" bgcolor="green">[[${paymentSuccess}]] </td>
	    </tr>
    </th:block>
    <!-- 
    <tr>
        <td width="50%" align="center" valign="middle">Received Checksum</td>
        <td width="50%" align="center" valign="middle">[[${checksum}]]</td>
    </tr>
    <tr>
        <td width="50%" align="center" valign="middle">Checksum Verified</td>
        <td width="50%" align="center" valign="middle">[[${verifyChecksum}]]</td>
    </tr>
     -->
    </table>
</div>
<br><br>


    <th:block th:if="${verifyChecksum}">
    <th:block th:if="${paymentCancelled} == null">
    
		<div th:replace="wallet/wallet-confirm-frag :: wallet-confirm('tag')"></div>
		
    </th:block> 
    </th:block>
    
<br><br>
<br><br>
	<footer th:replace="fragments :: page_footer"></footer>
 	<script type="text/javascript" th:src="@{../js/common.js}"></script>
</body>
<link type="text/css" th:href="@{/css/custom.css}" rel="stylesheet">
</html>
