<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="ISO-8859-1">
<link rel="stylesheet" type="text/css" th:href="@{/css/zaakpay.css}" >
<title>Insert title here</title>
</head>
<body>
<br><br>
<div align="center">
    <table width="500px;" class="customtable-all card">
    <th:block th:if="${!verifyChecksum}">
    <tr>
        <td width="50%" align="center" valign="middle">responseCode</td>
        <td width="50%" align="center" valign="middle"><font color=Red>***</font></td>
    </tr>
    <tr>
        <td width="50%" align="center" valign="middle">responseDescription</td>
        <td width="50%" align="center" valign="middle"><font color=Red>This response is compromised.</font></td>
    </tr>
    </th:block>
    <th:block th:unless="${verifyChecksum}">
	    <th:block th:each="zaakParam : ${responseParameters}">
	    <tr>
	        <td width="50%" align="center" valign="middle">[[${zaakParam}]]</td>
	        <td width="50%" align="center" valign="middle">[[${parameter}]]</td>
	    </tr>
	    </th:block>
    </th:block>
    <tr>
        <td width="50%" align="center" valign="middle">Received Checksum</td>
        <td width="50%" align="center" valign="middle">[[${checksum}]]</td>
    </tr>
    <tr>
        <td width="50%" align="center" valign="middle">Checksum Verified</td>
        <td width="50%" align="center" valign="middle">[[${verifyChecksum}]]</td>
    </tr>
    </table>
</div>
</body>
</html>
