<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
	th:fragment="holiday-search">
	
	<head>
		<style>
			.categoryStyle {
				box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
				border-radius: 10px;
    			background: white;
    			margin-top: 15px;
    			position: relative;
    			z-index: 100;
    			padding: 5px 0;
			}
			.colStyle {
    			display: flex;
    			justify-content: space-around;
			}
			.borderEnd {
				border-right: 1px solid #dbdbdb;
			}
			.borderMid {
				border-left: 1px solid #dbdbdb;
				height: 100%;
			}
			.travelerButton {
				display: flex;
    			justify-content: start;
			}
			.travelerSelection {
				overflow: hidden;
			}
			.travelerSelection p {
				margin: 3px 0 0;
				font-size: 14px;
				color: #9f9f9f;
				text-align: left;
			}
			.travelerSelection:hover {
				background: rgb(192, 192, 192);
				border-radius: 10px;
			}
			.cityFIcon {
				height: 58px; 
				display: flex; 
				flex-direction: column; 
				justify-content: center; 
				font-size: 24px;
				margin: 0 17px 0 20px;
			}
			#travellerFIcon {
				display: flex; 
				flex-direction: column; 
				justify-content: center; 
				font-size: 24px;
				margin: 0 36px 0 7px;
			}
			#categorySubmit {
				border-radius: 7px;
				background: rgb(89, 89, 255);
				color: white;    
				padding: 10px 15px;
				font-size: 22px;
				border: none;
    			width: -webkit-fill-available;
				margin: 0 10px;
			}
			
			#categorySubmit:hover {
				background: blue;
			}
			#holidaySearch {
			    display: flex;
			    justify-content: center;
			    padding: 12px 0;
			}
			.submitDiv {
				display: flex;
			    justify-content: center;
			    align-items: center;
			}
			.specialMobJustify {
				justify-content: space-evenly;
			}
			
			@media screen and (max-width: 800px) {
				.colStyle {
    				justify-content: start;
    				border: none !important;
				}
				.form-control {
					background-color: transparent;
					width: 100%;
				}
				.submitDiv {
			    	margin-top: 10px;
				}
				.dropMenuStyle {
					width: 90% !important;
				}
				
				.cityFIcon {
					margin: 0;
				}
				.mobDatePadding {
					padding: 0;
				}
				.specialMobJustify {
					justify-content: stretch;
				}
			}
			
			@media screen and (max-width: 600px) {
				.colStyle {
    				justify-content: start;
    				border: none !important;
				}
				.form-control {
					background-color: transparent;
					width: 100%;
				}
				body #mainHeroStyle #hero {
					height: 55vh;
				}
			}
			.autocomplete-active {
			  background-color: DodgerBlue !important; 
			  color: #ffffff; 
			}
			.autocomplete-items {
				position: absolute;
			    top: 57px;
			    z-index: 100;
			    background: white;
			    width: 100%;
			}
			.dropDwonCountStyle {
				display: flex;
    			justify-content: space-evenly;
			}
			input[type=number]::-webkit-inner-spin-button, 
			input[type=number]::-webkit-outer-spin-button {
			    -webkit-appearance: none;
			    -moz-appearance: none;
			    appearance: none;
			    margin: 0; 
			}
			.inputStylePax {
				width: 35px;
			    height: 35px;
    			text-align: center;
    			border: 1px solid #c2c2c2;
    			border-radius: 6px;
			}
			.incrementStyle {
				border: 1.5px solid #c6c6fa;
			    color: #c6c6fa;
			    cursor: none;
			    border-radius: 18px;
			    width: 35px;
			    height: 35px;
			    display: flex;
			    justify-content: center;
			    align-items: center;
			}
			.incStyle {
				border: 1.5px solid #5555d4;
			    color: #5555d4;
			    cursor: pointer;
			}
			.incrementStyle:hover {
				background: #dbdbdb;
			}
			.extraPadding {
				padding: 19px 14px;;
			}
			.dropMenuStyle {
				width: 30%;
    			box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 1px 0px inset, rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
			}
			.carousel-indicators {
				z-index: 1 !important;
			}
			.displaySetting {
				display: block;
			}
			.borderBottom {
				border-bottom: 1px solid #c2c2c2;    
				margin-bottom: 15px;
			}
			.centeredDiv {
				display: flex;
    			justify-content: center;
			}
			.checkInMiddleIcon {
				height: 58px;
			    display: flex;
			    flex-direction: column;
			    justify-content: center;
			    align-items: center;
			    font-size: 18px;
			}
			
			.over-flow {
				overflow: unset !important;
			}
			.row-fixed-stl {
				width: -webkit-fill-available;
				margin: 0;
			    border-radius: 8px;
			    border: 1px solid grey;
			}
			
			@media screen and (max-width: 600px) {
				.padding-row {
					padding-top: 4px;
				}
			}
			input {
				background: white !important;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="categoryStyle">
				<form id="holidaySearch" th:action="@{/holiday/saveSearchHoliday}" method="post">
					<div class="row" style=" margin: 0px; width: -webkit-fill-available;">
						<div class="col-md-3 col-sm-12 col-12 borderEnd" style="margin-top: 4px;">
							<div class="row row-fixed-stl">
								<div class="col-md-2  col-sm-2 col-1 ">
									<div class="cityFIcon">
										<i class="fa fa-solid fa-magnifying-glass"></i>
									</div>
								</div>
								<div class="col-md-10 col-sm-10 col-11">
									
									<div class="form-floating" id="aligner3">
										<input type="search" class="form-control hill1 input_styles" name="hotelCity" id="hotelCity" 
											placeholder="City" style="border: none;" required>
											
										<label class="labelStyle labelSetting" for="cityOne">
											Destination</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-md-5 col-sm-12 col-12 borderEnd" style="margin-top: 4px;">
							<div class="row row-fixed-stl">
								<div class="col-2 col-md-2 col-sm-2">
									<div class="cityFIcon">
										<i class="fa fa-regular fa-calendar"></i>
									</div>
								</div>
								<div class="col-10 col-md-10 col-sm-10 mobDatePadding">
									<div class="row">
										<div class="col-5 col-md-5 col-sm-5 mobDatePadding">
											<div class="form-floating" id="aligner3">
												<input type="text" class="form-control hill1 input_styles" name="checkInDate" id="checkInDate" placeholder="[[${#dates.format(today, 'dd MMMM, yy')}]]" 
												onfocus="(this.type='date')" onblur="(this.type='text')" style="border: none;" onclick="calenderViewNew(this)" required>
												
												<label class="labelStyle labelSetting" for="checkInDate">
													Journey-start</label>
											</div>
										</div>
										<div class="col-2 col-md-2 col-sm-2 mobDatePadding">
											<div class="checkInMiddleIcon"><i class="fa fa-solid fa-angles-right" style="width: fit-content;"></i></div>
										</div>
										<div class="col-5 col-md-5 col-sm-5 mobDatePadding">
											<div class="form-floating" id="aligner3">
												<input type="text" class="form-control hill1 input_styles" name="checkOutDate" id="checkOutDate" placeholder="[[${#dates.format(today, 'dd MMMM, yy')}]]" 
												onfocus="(this.type='date')" onblur="(this.type='text')" style="border: none;" onclick="calenderViewReturn('#checkInDate', this)">
												
												<label class="labelStyle labelSetting" for="checkOutDate">
													Journey-end</label>
											</div>
										</div>
									</div>
								</div>
							</div>
							
						</div>
						<div class="col-md-4 col-sm-12 col-12" style="margin-top: 4px;">
							<div class="row padding-row" style="margin: 0; border-radius: 8px;">
								<div class="col-12 col-md-7" style="padding: 0;">
									  <button type="button" class="btn travelerSelection" id="dropDwonButton" aria-expanded="false" style="width: 100%; border: 1px solid grey;">
									   <div class="justify_center_div specialMobJustify" style="padding: 10px 0;">
											<div id="travellerFIcon" >
												<i class="fa fa-solid fa-bed"></i>
											</div>
											<div>
												<b id="guestInfo">1 Guest</b>
											</div>
										</div>
									  </button>
									  <div class="dropdown-menu dropdown-menu-end dropMenuStyle" id="dropDownMenu">
										  <div class="row" style="padding: 5px 20px; overflow-y: scroll; height: 300px;">
											  <div class="col-6 extraPadding"><b>Adults</b></div>
											  <div class="col-6 extraPadding dropDwonCountStyle">
												  <div class="incrementStyle" id="decAdult"><i class="fa fa-solid fa-minus"></i></div>
												  <div><input name="noOfAdults" class="inputStylePax" min="0" type="number" id="adultNum" value="1" readonly></div>
												  <div class="incrementStyle" id="incAdult"><i class="fa fa-solid fa-plus"></i></div>
											   </div>
											  <div class="col-6 extraPadding"><b>Children</b></div>
											  <div class="col-6 extraPadding dropDwonCountStyle">
												  <div class="incrementStyle" id="decChild"><i class="fa fa-solid fa-minus"></i></div>
												  <div><input name="noOfChildren" class="inputStylePax" min="0" type="number" id="childNum" value="0" readonly></div>
												  <div class="incrementStyle" id="incChild"><i class="fa fa-solid fa-plus"></i></div>
											   </div>
											  <div class="col-12 borderBottom"></div>
											  <div class="col-12" >
												  <div class="row" id="append2"></div>
											  </div>
											  <div class="col-6 centeredDiv"><button type="button" class="btn btn-secondary" style="width: 80%;" id="resetButton"><b>Reset</b></button></div>
											  <div class="col-6 centeredDiv"><button type="button" class="btn btn-success" style="width: 80%;" id="applyButton"><b>Apply</b></button></div>
										  </div>
									  </div>
								</div>
								<div class="col-12 col-md-5 submitDiv">
									<button id="categorySubmit" type="submit" >Submit</button>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		
	</body>

	<script>
		$("#dropDwonButton").click(function(){
			$("#dropDownMenu").toggleClass('displaySetting');
			$("#mainHeroStyle").addClass('over-flow');
		});
		
		$(document).mouseup(function(e) {
		    var container = $("#dropDownMenu");
		
		     // if the target of the click isn't the container nor a descendant of the container
		    if (!container.is(e.target) && container.has(e.target).length === 0) {
				$("#dropDownMenu").removeClass("displaySetting");
				$("#mainHeroStyle").removeClass('over-flow');
			}
		});
	</script>
	<script>
		toggleNumberVal("#decAdult", "#incAdult", "#adultNum", 2, 1);
		toggleNumberVal("#decChild", "#incChild", "#childNum", 1, 0);
		
		function toggleNumberVal(minus, plus, input, minMax, minMin) {
			if(parseInt($(input).val()) > minMin) {
				$(minus).addClass('incStyle');
			} else {
				$(minus).removeClass('incStyle');
			}
			
			
			if(parseInt($(input).val()) <= 48) {
				$(plus).addClass('incStyle');
			} else {
				$(plus).removeClass('incStyle');
			}
			
			
			$(minus).click(function(){
				if(parseInt($(input).val()) >= minMax) {
					var newVal = parseInt($(input).val()) - 1;
					$(input).attr('value', newVal);
					
					if (parseInt($(input).val()) > minMin) {
						$(minus).addClass('incStyle');
						$(plus).addClass('incStyle');
					} else {
						$(minus).removeClass('incStyle');
					}
				} else {
					$(minus).removeClass('incStyle');
				}
				
			});
			
			$(plus).click(function(){
				if(parseInt($(input).val()) <= 48) {
					var newVal = parseInt($(input).val()) + 1;
					$(input).attr('value', newVal);
					
					if (parseInt($(input).val()) < 48) {
						$(plus).addClass('incStyle');
						$(minus).addClass('incStyle');
					} else {
						$(plus).removeClass('incStyle');
					}
				} else {
					$(plus).removeClass('incStyle');
				}
			});
		}
	</script>
	<script>
		$("#applyButton").click(function(){
			var totalGuest = parseInt($("#adultNum").val()) + parseInt($("#childNum").val());
			var childCount = parseInt($("#childNum").val());
			var gStr = " Guests";
			
			if (totalGuest == 1) {
				gStr = " Guest";
			}
			if(childCount > 0) {
				
				
				$("#staticBackdropChildAge").modal('show');
				
				$("#staticBackdropChildAge").find('.modal-body').empty();
				for (let i = 0; i < childCount; i++) {
					var countName = i + 1;
					var htmlCOde = `
									<div class="row">
										<div class="col-6 justify_center_div_column">
											<h6>Child ` + countName + `</h6>
										</div>
										<div class="col-6">
											<div class="form-floating">
												<input type="number" class="form-control hill1 input_styles" name="childAge" 
													placeholder="10" min="0" max="12" onKeyPress="if(this.value.length==2) return false;" form="holidaySearch" required>
													
												<label class="labelStyle labelSetting" for="cityOne">
													Age</label>
											</div>
										</div>
									</div>
									<hr>
									`;
									
				$("#staticBackdropChildAge").find('.modal-body').append(htmlCOde);
				
				}
				
				
			}
			
			$("#guestInfo").html(totalGuest + gStr);
			$("#dropDownMenu").toggleClass('displaySetting');
			$("#mainHeroStyle").removeClass('over-flow');
		});
		
		
		$("#resetButton").click(function(){
			$("#guestInfo").html("1 Guest");
			$("#adultNum").attr('value', 1);
			$("#childNum").attr('value', 0);
		});
	</script>
	<script>
		function calenderViewNew(input) {
			var today = new Date().toISOString().split('T')[0];
			$(input).attr('min', today);
		};
		
		function calenderViewReturn(input, output) {
			var inputAttrArr = $(input).val().split('-');
			var days = parseInt(inputAttrArr[2]) + 1;
			var strDays = "";
			if(days <= 9) {
				strDays = "0" + days;
			} else {
				strDays = "" + days;
			}
			
			var constVal = inputAttrArr[0] + "-" + inputAttrArr[1] + "-" + strDays;
			$(output).attr('min', constVal);
		};
		
	</script>

		var cityNames = [[${cityList}]];
		var cityIds = [[${cityIds}]];
		var stateProvince = [[${cityStates}]];
		var country = [[${cityCountries}]];
		
		var myInput = document.getElementById("hotelCity");
	</script>
<script type="text/javascript" th:src="@{js/hotelCityAuto.js}"></script>
</html>
