	.animation {
            font-size: 1.5rem;
            padding: 10px;
            border-radius: 5px;
            background-color: #2980b9;
            color: white;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
