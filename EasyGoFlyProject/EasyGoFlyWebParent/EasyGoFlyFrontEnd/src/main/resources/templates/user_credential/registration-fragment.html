
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<div th:fragment="content" th:remove="tag">
		
		<section id="hero" style="position: absolute; z-index: -1;" class="p-0">
			<div class="hero-container">
				<div id="heroCarousel" data-bs-interval="5000"
					class="carousel slide carousel-fade" data-bs-ride="carousel">

					<div class="carousel-indicators" id="hero-carousel-indicators">
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="0" class="active" aria-current="true"
							aria-label="Slide 1"></button>
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="1" aria-label="Slide 2"></button>
					</div>

					<div class="carousel-inner carousel-inner-cont" role="listbox">

						<!-- Slide 1 -->
						<div class="carousel-item active">
							<img th:src="@{/assets/images/slide/slide-1.jpg}" class="img-fluid login-img">
						</div>

						<!-- Slide 2 -->
						<div class="carousel-item">
							<img th:src="@{/assets/images/slide/slide-2.jpg}" class="img-fluid login-img">
						</div>

					</div>

					<a class="carousel-control-prev" href="#heroCarousel" role="button"
						data-bs-slide="prev"> <span
						class="carousel-control-prev-icon bi bi-chevron-left"
						aria-hidden="true"></span>
					</a> <a class="carousel-control-next" href="#heroCarousel"
						role="button" data-bs-slide="next"> <span
						class="carousel-control-next-icon bi bi-chevron-right"
						aria-hidden="true"></span>
					</a>

				</div>
			</div>
		</section>
	      
		<div class="imgbck login_box1" style="padding: 170px 0 35px 0;">
				<div class="container">
					<div class="col-md-7 col-12 registration_box" style=" border: 1px solid grey; border-radius: 15px; background-color: rgb(255 255 255 / 86%); padding: 10px;">
						<form th:action="@{/create_customer_account}" method="post" style="margin: 0 auto;" th:object="${customer}" onsubmit="return (checkEmailUnique(this))" enctype="multipart/form-data" id="submitForm">
							<div th:if="${warning != null}" class="alert alert-warning text-center">
								[[${warning}]]
							</div>
							<h3 class="text-center">Sign Up</h3>
							<p class="text-center mb-2">
								Already signed up? <a th:href="@{/login}" class="specialButton styleLinkHover styleLink"><span> Login</span></a>
							</p>
							<div class="mt-2" style="border: 1px solid grey; border-radius: 15px; background-color: rgba(255,255,255,0.4); padding: 10px;">
								<input type="hidden" th:field="*{id}">
								<div class="row">
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												First Name:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" th:field="*{firstName}" type="text" placeholder="First Name"
												required/>
										</div>
									</div>
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Last Name:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" th:field="*{lastName}" type="text" placeholder="Last Name" required
												/>
										</div>
									</div>
								</div>
								<br>
								<div class="row">
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Email:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="email" th:field="*{email}" placeholder="user@Email.com" required
												/>
										</div>
									</div>
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Phone Number:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="number" th:field="*{phone}" placeholder="Last Name" maxlength="12" required/>
										</div>
									</div>
								</div>
								<br>
								<div class="row">
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Business Name:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{businessName}" placeholder="ETC LTD" required
												/>
										</div>
									</div>
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												PAN:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{pan}" placeholder="FT********" required/>
										</div>
									</div>
								</div>
								<br>
								<br>
								<div class="row">
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Aadhaar No.:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{aadhaar}" placeholder="6092********" required
												/>
										</div>
									</div>
									<div class="col-md-6">
										<div class="row">
											<label class="col-sm-4 col-form-label">Upload Aadhar:</label>
											<small>File type .jpg, .png, .pdf. Maximum size is 500 kb.</small>
											<div class="col-sm-12">
												<input type="hidden" th:field="*{aadhaarDoc}">
												<input type="file" name="doc" id="fileAadhaar" accept="image/png, image/jpeg, .pdf" onchange="showImageThumbnail(this, '#thumbnailAadhaar')" class="mb-2" required/>
												<img class="img-thumbnail img-fluid" id="thumbnailAadhaar" th:src="@{images/blank-doc.png}" alt="Aadhaar Preview" style="max-width: 25% !important;"/>
											</div> 
										</div>
									</div>
								</div>
								<br>
								<div class="row mb-3">
									<label for="inputPassword3"
										class="col-sm-10 col-form-label label"><p>
											Address Line 1:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{addressLine1}" placeholder="Type your address" required/>
									</div>
								</div>
								<div class="row mb-3">
									<label for="inputPassword3"
										class="col-sm-10 col-form-label label"><p>
											Address Line 2:
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{addressLine2}" placeholder="Type your address"/>
									</div>
								</div>
								<div class="row">
									<div class="col-md-6">
										<label for="inputPassword3"
											class="col-sm-10 col-form-label label"><p>
												Country:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<select class="form-control" th:field="*{country}" required>
												<th:block th:each="country : ${listCountries}">
													<option th:value="${country.id}">[[${country.name}]]</option>
												</th:block>
											</select>
										</div>
									</div>
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												City:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="text" th:field="*{city}" placeholder="City"  required/>
										</div>
									</div>
								</div>
								<br>
								<div class="row">
									<div class="col-md-6">
										<label for="inputPassword3"
											class="col-sm-10 col-form-label label"><p>
												State:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="form-control" type="text" th:field="*{state}" placeholder="State" list="listStates" required/>
											<datalist id="listStates">
											</datalist>
										</div>
									</div>
									<div class="col-md-6">
										<label for="" class="col-sm-10 col-form-label label"><p>
												Pin Code:<span class="star_marked"> *</span>
											</p></label>
										<div class="col-sm-10" style="width: 100%;">
											<input class="input form-control" type="number" th:field="*{postalCode}" maxlength="8" required/>
										</div>
									</div>
								</div>
								<br>
								<div class="row">
									<div class="col-2 form-check" style="padding-left: 50px;">
									  <input class="form-check-input" type="radio" name="flexRadioDefault" th:field="*{gender}" th:value="male" checked>
									  <label class="form-check-label" for="flexRadioDefault1">
									    Male
									  </label>
									</div>
									<div class="col-2 form-check" style="padding-left: 30px;">
									  <input class="form-check-input" type="radio" name="flexRadioDefault" th:field="*{gender}" th:value="female">
									  <label class="form-check-label" for="flexRadioDefault2">
									    Female
									  </label>
									  </div>
									<br>
								</div>
									<div class="form-group row">
										<div class="col-sm-12">
											<label class="col-sm-4 col-form-label">Profile Picture:</label>
											<input type="hidden" th:field="*{photos}">
											<input type="file" name="image" id="fileImage" accept="image/png, image/jpeg" onchange="showImageThumbnail(this, '#thumbnail')"class="mb-2"/>
											<img class="img-thumbnail img-fluid" id="thumbnail" th:src="@{${customer.photosImagePath}}" alt="Photo Preview" style="max-width: 25% !important;"/>
										</div> 
									</div>
								
								<br>
								<div class="row mb-3" style="width: 40%; margin: 0 auto;">
									<input type="submit" id="submitButton"
										class="btn btn-primary button" value="Sign Up">
								</div>
							</div>
						</form>
				</div>
			</div>
		</div>
			
	</div>
</body>
</html>
