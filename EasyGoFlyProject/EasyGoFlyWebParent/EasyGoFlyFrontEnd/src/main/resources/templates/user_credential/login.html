	  <!-- Template Main CSS File -->

	  <style type="text/css">
	  	*.specialButton {
			cursor: pointer;
			width: auto;
			color: #2c2c2ceb;
		    padding: 3px 9px;
		    border-radius: 5px;
		    border: 1px solid green;
		    font-weight: 600;
		    box-shadow: rgb(100 100 111 / 20%) 0px 7px 29px 0px;
			  -webkit-transition: background-color 2s ease-out;
			  -moz-transition: background-color 2s ease-out;
			  -o-transition: background-color 2s ease-out;
			  transition: background-color 2s ease-out;
			  -webkit-transition: color 0.5s ease-out;
			  -moz-transition: color 0.5s ease-out;
			  -o-transition: color 0.5s ease-out;
			  transition: color 0.5s ease-out;
		}
		*.specialButton:hover {
			background-color: green;
			color: white;
		}
		*.a_center {
			width: auto !important;
		    display: flex !important;
		    justify-content: center !important;
		}
		*.horiz {
			display: inline-block !important;
			zoom: 1;
			float: left;
			text-align: center;
			margin: 8px 0;
    		width: 100% !important;
		}
		*.google_button {
			/* From https://css.glass */
			background: rgba(139, 239, 163, 0.78);
			border-radius: 16px;
			backdrop-filter: blur(2px);
			-webkit-backdrop-filter: blur(2px);
			border: 1px solid rgba(139, 239, 163, 0.28);
			box-shadow: rgb(0 0 0 / 10%) 0px 10px 20px, rgb(0 0 0 / 10%) 0px 10px 20px;
			height: 100%;
		}
		*.google_button h5 {
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    margin: 0;
		    padding: 0;
		}
		*.google_button:hover {
		    background: rgb(116 208 138 / 78%);
		    backdrop-filter: blur(10px);
   			-webkit-backdrop-filter: blur(10px);
   			color: green;
   			box-shadow: rgb(0 0 0 / 20%) 0px 10px 20px, rgb(0 0 0 / 26%) 0px 10px 20px;
		}
		*.facebook_button {
			background: rgb(139 175 239 / 78%);
			border-radius: 16px;
			backdrop-filter: blur(2px);
			-webkit-backdrop-filter: blur(2px);
			border: 1px solid rgba(139, 175, 239, 0.28);
			box-shadow: rgb(0 0 0 / 10%) 0px 10px 20px, rgb(0 0 0 / 10%) 0px 10px 20px;
			height: 100%;
		}
		*.facebook_button h5 {
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    margin: 0;
		    padding: 0;
		    color: #0000ff6e;
		}
		*.facebook_button:hover {
		    background: rgb(107 116 192 / 78%);
		    backdrop-filter: blur(10px);
   			-webkit-backdrop-filter: blur(10px);
   			color: #0000ffb0;
   			box-shadow: rgb(0 0 0 / 20%) 0px 10px 20px, rgb(0 0 0 / 26%) 0px 10px 20px;
		}
  /* Responsive */
@media only screen and (max-width: 600px) {
	*.ul_modify {
	  	border-radius: 7px;
	  	box-shadow: 0 0 5px 6px;
	    background: #ffffff2b !important;
	    backdrop-filter: blur(10px);
	  }
	  *.media_status_flex { 
	  display: flex !important;
	  justify-content: center;
	  align-items: center;
  	}
  	*.media_status { display: block !important;}
  	*.media-hide { display: none !important;}
	  *.inbox_login_button {
		cursor: pointer;
		margin: 3px 5px;
		background: white;
		width: auto;
		color: #2c2c2ceb;
	    padding: 3px 9px;
	    border-radius: 5px;
	    border: 1px solid green;
	    font-weight: 600;
	    box-shadow: rgb(100 100 111 / 20%) 0px 7px 29px 0px;
		  -webkit-transition: background-color 2s ease-out;
		  -moz-transition: background-color 2s ease-out;
		  -o-transition: background-color 2s ease-out;
		  transition: background-color 2s ease-out;
		  -webkit-transition: color 0.5s ease-out;
		  -moz-transition: color 0.5s ease-out;
		  -o-transition: color 0.5s ease-out;
		  transition: color 0.5s ease-out;
	}
	*.background_media {
		background: #c6ecff !important;
	}
}
*.forgot_password {
	float: right;
	cursor: pointer;
	color: blue;
	font-weight: 600;
	text-decoration: none;
}
*.forgot_password:hover {
	color: green;
	text-decoration: blink;
}
	  </style>
</head>
<body>

<!-- ======= Header ======= -->
<header id="header" class="fixed-top d-flex align-items-center">

    <div class="container d-flex align-items-center justify-content-between">

      <h1 class="logo"></h1>
      <!-- Uncomment below if you prefer to use an image logo -->
      <div class="col">
      	<a th:href="@{/}" style="height: 60px;"><img th:src="@{${SITE_LOGO}}" alt="" class="img-fluid" style="width: auto; height: 105px; float: left;"></a>
      </div>
      
      

      <nav id="navbar" class="navbar" >
        <ul class="ul_modify">
          <li class="media-hide"></li>
          <li class="media-hide"></li>
          <li class="inbox_login_button"><a  id="li1" class="nav-link scrollto modify_link_navigation" th:href="@{/}">
          	<i class="fa-solid fa-house media_status" style="display: none;">&nbsp;&nbsp;</i><span>Home</span></a>
          </li>
          <li class="inbox_login_button"><a  id="li2" class="nav-link scrollto modify_link_navigation" th:href="@{/search_result}">
          	<i class="fa-solid fa-bell-concierge media_status" style="display: none;">&nbsp;&nbsp;</i><span>Services</span></a>
          </li>
          <li class="inbox_login_button"><a  id="li3" class="nav-link scrollto modify_link_navigation" th:href="@{/about#no-2}">
          	<i class="fa-solid fa-circle-info media_status" style="display: none;">&nbsp;&nbsp;</i><span>About Us</span></a>
          </li>
          <li class="inbox_login_button"><a  id="li4" class="nav-link scrollto modify_link_navigation" th:href="@{/about#no-3}">
          	<i class="fa-solid fa-address-book media_status" style="display: none;">&nbsp;&nbsp;</i><span>Contact</span></a>
          </li>
          <li class="dropdown inbox_login_button background_media" th:hidden="${#authorization.expression('hasAuthority(''Customer'')')}" >
	          <a href="#">
		          <span style="display: flex !important;  justify-content: start;">
		          	<i class="fa-solid fa-address-card media_status_flex" style="display: none;">&nbsp;&nbsp;</i><span>Account</span>
		          </span> 
		          <i class="bi bi-chevron-down"></i>
	          </a>
              <li th:replace="user_credential/loginModal :: login('tag')"></li>
          </li>
          
          	<li class="dropdown inbox_login_button background_media" th:if="${#authorization.expression('hasAuthority(''Customer'')')}" >
	          	<a href="#">
	          		<span style="display: flex !important;  justify-content: start;">
		          		<i class="fa-solid fa-address-card media_status_flex" style="display: none;">&nbsp;&nbsp;</i><span>Account</span>
		          	</span> 
		          	<i class="bi bi-chevron-down"></i>
	          	</a>
	          	<li th:replace="user_credential/loginModal :: loggedin('tag')"></li>
          	</li>
          
        </ul>
        <i class="bi bi-list mobile-nav-toggle"></i>
      </nav><!-- .navbar -->

    </div>
  </header><!-- End Header -->
    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  
	 <div th:replace="whatsapp :: content"></div>
	 
	<div>
		<section id="hero">
			<div class="hero-container">
				<div id="heroCarousel" data-bs-interval="5000"
					class="carousel slide carousel-fade" data-bs-ride="carousel">

					<div class="carousel-indicators" id="hero-carousel-indicators">
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="0" class="active" aria-current="true"
							aria-label="Slide 1"></button>
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="1" aria-label="Slide 2"></button>
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="2" aria-label="Slide 3"></button>
					</div>

					<div class="carousel-inner carousel-inner-cont" role="listbox">

						<!-- Slide 1 -->
						<div class="carousel-item active"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-1.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

						<!-- Slide 2 -->
						<div class="carousel-item"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-2.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

						<!-- Slide 3 -->
						<div class="carousel-item"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-2.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

					</div>

					<a class="carousel-control-prev" href="#heroCarousel" role="button"
						data-bs-slide="prev"> <span
						class="carousel-control-prev-icon bi bi-chevron-left"
						aria-hidden="true"></span>
					</a> <a class="carousel-control-next" href="#heroCarousel"
						role="button" data-bs-slide="next"> <span
						class="carousel-control-next-icon bi bi-chevron-right"
						aria-hidden="true"></span>
					</a>

				</div>
			</div>
		</section>
			<div class="imgbck login_box1" style="padding: 170px 0 35px 0;">
			<div class="container">
				<div class="col-md-5 col-12 registration_box" style="box-shadow: rgb(0 0 0 / 25%) 0px 10px 20px, rgb(0 0 0 / 40%) 0px 10px 20px;">
			<form th:action="@{/login}" method="post" >
				<div th:if="${param.error}">
					<p class="text-danger">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</p>
				</div>
				<div th:if="${param.logout}">
					<p class="text-warning">You have logged out.</p>
				</div>
				<div>
					<h1 class="text-center" style="margin-bottom: 24px;">Login</h1>
					<div class="row mb-3">
						<div class="col-sm-12">
							<div class="row">
								<div class="col-sm-6 col-6">
									<a th:href="@{/oauth2/authorization/google}" class="" style="margin: 0 5px; width: auto; display: block;">
										<div class="row google_button" >
											<img th:src="@{assets/img/google.png}" alt="" class="img-fluid col-3" style="padding: 5px;">
											<h5  class="col-9">Login with Google</h5>
										</div>
									</a>
								</div>
								<div class="col-sm-6 col-6">
									<a th:href="@{/oauth2/authorization/facebook}" class="" style="margin: 0 5px; width: auto; display: block;">
										<div class="row facebook_button" >
											<img th:src="@{assets/img/facebook.png}" alt="" class="img-fluid col-3" style="padding: 5px;">
											<h5 class="col-9">Login with Facebook</h5>
										</div>
									</a>
								</div>
							
							</div>
							
						</div>
					</div>
					<p class="text-center">Please <a th:href="@{/registration}" class="specialButton styleLinkHover styleLink"><span> Sign up</span></a> if you're not registered!</p>
					<div style=" border: 1px solid grey; border-radius: 15px; background-color: rgba(255,255,255,0.4); padding: 10px;">
						<input type="hidden" class="input middle" value="0">
						<div class="row mb-3">
							<label for="inputEmail3" class="col-sm-3 col-form-label label"><p>
									Email:<span class="star_marked"> *</span>
								</p></label><br>
							<div class="col-sm-10" style="width: 100%;">
								<input type="email" class="form-control" name="email" 
									placeholder="username@email.com" required>
							</div>
						</div>
						<div class="row mb-3">
							<label for="inputPassword3" class="col-sm-4 col-form-label label"><p>
									Password:<span class="star_marked"> *</span>
								</p></label>
							<div class="col-sm-10" style="width: 100%;">
								<input type="password" class="form-control input" name="password"
									 placeholder="Password" required>
							</div>
						</div>
						<div class="row mb-3">
							<div class="col-sm-10">
								<div class="form-check">
									<input type="checkbox" id="gridCheck1" name="remember-me">
									<label class="form-check-label" for="gridCheck1"> Stay logged in! </label>
								</div>
							</div>
						</div>
						<div class="row mb-3">
							<div class="col-sm-12">
								<div class="form-check">
									<a th:href="@{/forgot_password}" class="forgot_password">Forgot Password?</a>
								</div>
							</div>
						</div>
						
						<div class="row mb-3" style="width: 40%; margin: 0 auto;">
							<input type="submit" name="submit" class="btn btn-primary button"
								value="Login">
						</div>
					</div>
				</div>
				</form>
			</div>
			</div>
		</div>
		</div>
		
		

		<footer th:replace="fragments :: page_footer"></footer>
	</div>

</body>
<link th:href="@{css/custom.css}" rel="stylesheet">
