<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org 
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<li th:fragment="login(remove)" th:remove="${remove}" >	
	<ul class="no-search dropdown-menu" id="noStyle" style=" width: auto; border: none; box-shadow: none !important; border-radius: 7px; padding: 5px; background:rgb(227 246 255 / 79%); transform: translate3d(-0.8571399999999993px, 32px, 0px) !important;" aria-labelledby="dropdownMenuLink"> 
		<li class="horiz"><a type="button"
			class="btn btn-primary btn_style_menu a_center"
			th:href="@{/login}"
			id="login_b"> <i class="fa fa-solid fa-user" style="padding-right: 13px;"></i> <p style="font-size: 22px; margin: 0;">Log in</p>
		</a></li>

		<li class="horiz"><a type="button"
			class="btn btn-info btn_style_menu hover a_center"
			th:href="@{/registration}"><p style="font-size: 22px; margin: 0;">Sign up</p></a></li>


		<li class="horiz"><a type="button"
			class="btn btn-info btn_style_menu hover a_center"
			href="https://easegofly.com:8443/admin"><p style="font-size: 22px; margin: 0;">Partner Login</p></a></li>


	</ul>
	
	</li>
	
	<li th:fragment="loggedin(remove)" th:remove="${remove}">
		<th:block sec:authorize="hasAnyAuthority('Customer', 'ROLE_USER')">
		<ul class="no-search dropdown-menu" id="noStyle" style=" width: auto; border: none; box-shadow: none !important; border-radius: 7px; padding: 5px; background: rgb(227 246 255 / 79%);" aria-labelledby="dropdownMenuLinkLogged">
			<li class="nav-item horiz">
				<p class="text_modify" sec:authentication="principal.fullName"><i class="fa fa-solid fa-user" style="padding-right: 13px;"></i></p>
			</li>
	
			<li class="nav-item horiz"><a type="button"
				class="btn btn-info hover a_center"
				th:href="@{/wallet-home}"><p style="font-size: 22px; margin: 0;" id="walletBalance">Wallet</p></a>
			</li>
			<li class="nav-item horiz"><a type="button"
				class="btn btn-info btn_style_menu hover a_center"
				th:href="@{/manage_booking}">
				<p style="font-size: 22px; margin: 0;">Manage Booking</p></a>
			</li>
				 	
			<li class="nav-item horiz"><a type="button"
				class="btn btn-info hover a_center" data-bs-toggle="popover"
				title="Popover title" th:href="@{/account}"><p style="font-size: 22px; margin: 0;">Manage
					Account</p></a>
			</li>
			<form th:action="@{/logout}" method="post" th:hidden="true" name="logoutForm" id="logoutForm">
				<input type="submit" value="SSSSS">
			</form>
			<li class="nav-item horiz btn btn-danger hover">
				<button type="submit" class="btn btn-dangar" form="logoutForm" style="font-size: 22px; margin: 0; padding: 0; color: white;">Logout!</button>
			</li>
			
		</ul>
			
		</th:block>
	</li>
</li>
<script type="text/javascript" th:src="@{/js/common.js}"></script>
</body>
</html>
