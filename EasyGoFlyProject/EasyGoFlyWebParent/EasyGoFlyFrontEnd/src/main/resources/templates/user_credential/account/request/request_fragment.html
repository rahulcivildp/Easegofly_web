<head>
<style type="text/css">
	*.specialButtonCancel {
	cursor: pointer;
	width: auto;
	color: #2c2c2ceb;
    padding: 6px 9px;
    border-radius: 5px;
    border: 1px solid rgb(254, 132, 80);
    font-weight: 600;
    box-shadow: rgb(100 100 111 / 20%) 0px 7px 29px 0px;
	  -webkit-transition: background-color 2s ease-out;
	  -moz-transition: background-color 2s ease-out;
	  -o-transition: background-color 2s ease-out;
	  transition: background-color 2s ease-out;
	  -webkit-transition: color 0.5s ease-out;
	  -moz-transition: color 0.5s ease-out;
	  -o-transition: color 0.5s ease-out;
	  transition: color 0.5s ease-out;
}
*.specialButtonCancel:hover {
	background-color: rgb(254, 132, 80);
	color: white;
}
*.specialButtonOrdered {
	cursor: help;
	width: auto;
	color: #2c2c2ceb;
    padding: 6px 9px;
    border-radius: 5px;
    border: 1px solid #4686d2;
    font-weight: 600;

	  -moz-transition: color 0.5s ease-out;
	  -o-transition: color 0.5s ease-out;
	  transition: color 0.5s ease-out;
}
*.specialButtonOrdered:hover {
	background-color: #4686d2;
	color: white;
}
.colorTab{
	color: rgb(254, 132, 80) !important;
}

</style>
