<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
	<head th:replace="fragments :: page_head('Forgot password ', 'tag')"></head>


<style type="text/css">
	*.forgot_pas {
		border: 1px solid;
	    padding: 10px;
	    border-radius: 7px;
	    margin-bottom: 15px;
	    box-shadow: rgb(0 0 0 / 25%) 0px 10px 20px, rgb(0 0 0 / 40%) 0px 10px 20px;
	}

</style>
</head>
<body>
  <header id="header" class="fixed-top d-flex align-items-center" >
  	<div th:replace="fragments :: page_header('tag')"></div>
  </header>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  
  <div th:replace="whatsapp :: content"></div>
  
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<div class="container">
	<div style="display: flex; justify-content: center;">
		<div class="col-md-6 forgot_pas">
			<form th:action="@{/forgotPassSendEmail}" method="post">
				<div class="alert alert-danger" role="alert" th:if="${error != null}">[[${error}]]</div>
				<h4>Please provide your email. We will send you a link to generate password.</h4>
				<div class="row">
					<label for="" class="col-sm-3 col-form-label label"><p>
							Email ID:<span class="star_marked"> *</span>
						</p></label>
					<div class="col-sm-9">
						<input class="input form-control" type="email" name="emailId" placeholder="user@email.com" required autofocus="autofocus"/>
					</div>
					<div class="col-sm-12">
						<input class="input form-control specialButton_danger" style="padding: 5px 25px !important; float: right;" type="submit" value="Submit"/>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
 <br>
<br>
<br>
<br><br>
<br>

 <footer th:replace="fragments :: page_footer"></footer>
 <script type="text/javascript" th:src="@{/js/common.js}"></script>
</body>
<link th:href="@{css/custom.css}" rel="stylesheet">
</html>
