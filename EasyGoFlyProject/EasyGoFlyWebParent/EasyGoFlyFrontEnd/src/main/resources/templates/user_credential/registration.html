		<div class="login_box1" >
		
			<div class="container regMod">
				<div class="col-md-8 registration_box">
					<form th:action="@{/create_customer_account}" method="post" style="margin: 0 auto;" th:object="${customer}" onsubmit="return (checkEmailUnique(this))" enctype="multipart/form-data" id="submitForm">
						<div th:if="${warning != null}" class="alert alert-warning text-center">
							[[${warning}]]
						</div>
						<h3 class="text-center">Sign Up</h3>
						<p class="text-center">
							Already signed up? <a th:href="@{/login}" class="specialButton styleLinkHover styleLink"><span> Login</span></a>
						</p>
						<div style="border: 1px solid grey; border-radius: 15px; background-color: rgba(255,255,255,0.4); padding: 10px;">
							<input type="hidden" th:field="*{id}">
							<div class="row">
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											First Name:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" th:field="*{firstName}" type="text" placeholder="First Name"
											required/>
									</div>
								</div>
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											Last Name:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" th:field="*{lastName}" type="text" placeholder="Last Name" required
											/>
									</div>
								</div>
							</div>
							<br>
							<div class="row">
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											Email:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="email" th:field="*{email}" placeholder="user@Email.com" required
											/>
									</div>
								</div>
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											Phone Number:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="number" th:field="*{phoneNumber}" placeholder="Last Name" maxlength="12" required/>
									</div>
								</div>
							</div>
							<br>
							<div class="row">
								<div class="col-md-6">
									<label for="inputPassword3"
										class="col-sm-10 col-form-label label"><p>
											Password:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" th:field="*{password}" type="password"
											placeholder="password" oninput="checkPasswordMatch(document.getElementById('confirmPassword'))" minLength="8" maxlength="20" required/>
									</div>
								</div>
								<div class="col-md-6">
									<label for="confirmPassword"
										class="col-sm-10 col-form-label label"><p>
											Confirm Password:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" id="confirmPassword" type="password"
											placeholder="password" oninput="checkPasswordMatch(this)" minLength="8" maxlength="20" required/>
									</div>
								</div>
							</div>
							<br>
							<div class="row mb-3">
								<label for="inputPassword3"
									class="col-sm-10 col-form-label label"><p>
										Address Line 1:<span class="star_marked"> *</span>
									</p></label>
								<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="text" th:field="*{addressLine1}" placeholder="Type your address" required/>
								</div>
							</div>
							<div class="row mb-3">
								<label for="inputPassword3"
									class="col-sm-10 col-form-label label"><p>
										Address Line 2:
									</p></label>
								<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="text" th:field="*{addressLine2}" placeholder="Type your address"/>
								</div>
							</div>
							<div class="row">
								<div class="col-md-6">
									<label for="inputPassword3"
										class="col-sm-10 col-form-label label"><p>
											Country:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<select class="form-control" th:field="*{country}" required>
											<th:block th:each="country : ${listCountries}">
												<option th:value="${country.id}">[[${country.name}]]</option>
											</th:block>
										</select>
									</div>
								</div>
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											City:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="text" th:field="*{city}" placeholder="City"  required/>
									</div>
								</div>
							</div>
							<br>
							<div class="row">
								<div class="col-md-6">
									<label for="inputPassword3"
										class="col-sm-10 col-form-label label"><p>
											State:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="form-control" type="text" th:field="*{state}" placeholder="State" list="listStates" required/>
										<datalist id="listStates">
										</datalist>
									</div>
								</div>
								<div class="col-md-6">
									<label for="" class="col-sm-10 col-form-label label"><p>
											Pin Code:<span class="star_marked"> *</span>
										</p></label>
									<div class="col-sm-10" style="width: 100%;">
										<input class="input form-control" type="number" th:field="*{postalCode}" maxlength="8" required/>
									</div>
								</div>
							</div>
							<br>
							<div class="row">
								<div class="col-2 form-check" style="padding-left: 50px;">
								  <input class="form-check-input" type="radio" name="flexRadioDefault" th:field="*{gender}" th:value="male" checked>
								  <label class="form-check-label" for="flexRadioDefault1">
								    Male
								  </label>
								</div>
								<div class="col-2 form-check" style="padding-left: 30px;">
								  <input class="form-check-input" type="radio" name="flexRadioDefault" th:field="*{gender}" th:value="female">
								  <label class="form-check-label" for="flexRadioDefault2">
								    Female
								  </label>
								  </div>
								<br>
							</div>
								<div class="form-group row">
									<label class="col-sm-4 col-form-label">Profile Picture:</label>
									<div class="col-sm-8">
										<input type="hidden" th:field="*{photos}">
										<input type="file" name="image" id="fileImage" accept="image/png, image/jpeg" class="mb-2"/>
										<img class="img-thumbnail img-fluid" id="thumbnail" th:src="@{${customer.photosImagePath}}" alt="Photo Preview" style="max-width: 25% !important;"/>
									</div> 
								</div>
							
							<br>
							<div class="row mb-3" style="width: 40%; margin: 0 auto;">
								<input type="submit" id="submitButton"
									class="btn btn-primary button" value="Sign Up">
							</div>
						
					</form>
				</div>
			</div>
		</div>
	</div>
	
	<div class="modal fade text-center" id="modalDialogue">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title" id="modalTitle"></h4>
					<button type="button" class="close" data-bs-dismiss="modal">&times;</button>
				</div>
				<div class="modal-body">
					<span id="modalBody" style="color: red;"></span>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>	
	</div>
	<div>

	</div>
	
	
<script type="text/javascript" th:src="@{/js/common_form.js}"></script>

<script type="text/javascript">

	moduleURL = "[[@{/}]]";
	
	imageSize = 1024;
	
	sizeScale = "MB";
	
	
	
	
	function checkEmailUnique($("#submitForm")) {
		userEmail = $("#email").val();
		userId = $("#id").val();
		csrfVal = $("input[name='_csrf']").val();
		url = "[[@{/customers/check_email}]]";
		params = {id: userId, email: userEmail, _csrf: csrfVal};
			
		$.post(url, params, function(response) {
			if (response == "OK") {
				showModelDialogue("Success", "User is Created");
				$("#submitForm").submit();
			} else if (response == "Duplicate Email") {
				showModelDialogue("Warning", response + " is provided: " + userEmail);
			} else {
				showModelDialogue("Error", "Unknown response from server.");
			}
		}).fail(function(){
			showModelDialogue("Error", "Could not connect to the server.");
		});
		
		return false;
	};
	
	function showModelDialogue(title, message) {
		if (message != null) {
			$("#modalTitle").text(message);
			$("#modalBody").text(message);
			$("#modalDialogue").modal();
		};
	};
	
	
</script>
