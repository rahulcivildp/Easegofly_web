<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: page_head('Messaging ', 'none')"></head>
<style>
.modal_chat_style {
	text-align: start;
    border: 1px solid #dedede;
    border-radius: 7px;
    background: #eeeeee;
    padding: 5px 12px;
    margin: 4px 0 12px 0;
    display: inline-block
}
.textarea {
    resize: none;
    overflow: hidden;
    width: 100%;
    border-radius: 5px;
}
.msg_outer_div {
	background: #cccccc;
    border-radius: 7px;
    margin-bottom: 15px;
    height: 89vh;
    width: 100%;
}
.msg_inner_div {
    background: white;
    border-radius: 6px;
    height: 83vh;
    display: inline;
    overflow: scroll;
    overflow-x: hidden;
}
</style>
<body>

	<div class="hide-lg">
		<!-- Preloader -->
		<div id="preloader">
		    <div id="status"></div>
		</div>
		<!-- Preloader Ends -->
		
		<!-- header starts -->
	   
	    <header class="main_header_area">
			<div th:replace="nav-fragment :: page_header('tag')"></div>
		</header>
	    <!-- header ends -->
	
	</div>


	<div class="hide-mobile btndeactive scrollbar-hidden">
	  <section id="preloader-mobile" class="spalsh-screen">
	    <div class="circle text-center">
	      <div>
	        <h1>EaseGoFly</h1>
	        <p>Discover Your Destinition</p>
	      </div>
	    </div>
	    <div class="loader-spinner">
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
	      <div></div>
		</div>
	</section>
		<!-- splash-screen end -->
	
		<main class="home">
			<div th:replace="nav-fragment :: page_header_mobile('tag')"></div>
		</main>
	</div>
	
	<section class="py-12" >
		<div class="container" id="convo">
			<div class="msg_outer_div row">
				<h4 class="modal-title col-md-11 col-9"><span style="font-weight: 400; font-size: 20px;">[[${request.subject}]]</span></h4>
				<div class="col-3 col-md-1" style="padding: 0;">
					<div>
						<a type="button" id="reload_page" class="specialButton_reverse styleLink col" style="display: inline; float: left;"><i class="fa fa-solid fa-rotate-right"></i></a>
					</div>
					<div>
						<a type="button" th:href="@{/account#new_content2}" class="specialButton_danger_reverse styleLink col" style="display: inline; float: right;">&times;</a>
					</div>
				</div>
			
				<div class="msg_inner_div col-12">
					<th:block th:each="chat : ${listConversations}">
						<div class="col-12" id="chatBodyDiv" style="display: flex; justify-content: end;">
							<p th:if="${chat.repliedFrom} != 'support@easegofly.com'" class="modal_chat_style">[[${chat.chatBody}]]</p>
						</div>
						<div class="col-12">
							<div th:if="${chat.repliedFrom} == 'support@easegofly.com'" class="modal_chat_style" >[[${chat.chatBody}]]<br>
							<p style="font-size: 8px; margin: 0;" >Sent by <b>Easegofly Team</b>  </p> </div>
						</div>
					</th:block>
					<form th:action="@{/request/conversation/save}" method="post" th:object="${conversation}">
						<input type="hidden" name="request_id" th:value="${request.id}">
						<div class="col-12">
							<div class="input-group mb-3" style=" margin: 0 !important;">
							  <textarea class="form-control textarea" rows="1" cols="" oninput="auto_grow(this)" aria-label="Recipient's username" aria-describedby="addConversation" name="chatBody"></textarea>
							  <input type="submit" id="addConversation" class="input-group-text specialButton_reverse float-right" value="Send">
							</div>
							
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="whatsapp :: content"></div>
 	<footer th:replace="fragments :: page_footer('tag')"></footer>

</body>

<script>
	if (window.innerWidth < 900) { 
		$("#convo").removeClass("container");
		$("#convo").css("margin-bottom", "70px");
	}
	
</script>
	
<script type="text/javascript">
contextPath = "[[@{/}]]";

function auto_grow(element) {
    element.style.height = "5px";
    element.style.height = (element.scrollHeight)+"px";
}

$("#reload_page").click(function(){
	location.reload(true);
})

</script>

</html>
