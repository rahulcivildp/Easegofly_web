	<style type="text/css">
		.rowSuccess {
			    padding: 10px;
			    border: 1px solid grey;
			    border-radius: 7px;
			    background: #0080007a;
			    color: white;
			    margin: 5px 0;
		} 
		
		.rowCancel {
			    padding: 10px;
			    border: 1px solid grey;
			    border-radius: 7px;
			    background: #80000042;
			    color: white;
			    margin: 5px 0;
		} 
	
	</style>
</head>	
<body>

  <header id="header" class="fixed-top d-flex align-items-center" >
  	<div th:replace="fragments :: page_header('tag')"></div>
  </header>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  
  <div th:replace="whatsapp :: content"></div>
  <br>
  <br>
  <br>
  <br>
<div class="container" style="border: 3px solid #848cea; border-radius: 8px; margin-bottom: 20px; margin-top: 30px; box-shadow: rgb(0 0 0 / 25%) 0px 10px 20px, rgb(0 0 0 / 40%) 0px 10px 20px; padding: 20px;">
	<h2>Recharge History:</h2>
	<th:block th:each="rechargeHistory : ${rechargeHistories}">
		<div th:class="${rechargeHistory.rechargeHistoryStatus} == ${rechargeStatus} ? 'row rowSuccess' : 'row rowCancel'">
			<div class="col-2">Date: [[${rechargeHistory.date}]]</div>
			<div class="col-2"></div>
			<div class="col-2">TRN ID: [[${rechargeHistory.transaction}]]</div>
			<div class="col-2" th:id="'rechargeAmount' + ${rechargeHistory.id}"></div>
			<div class="col-2"></div>
			<div class="col-2">Status: [[${rechargeHistory.rechargeHistoryStatus}]]</div>
		</div>
		<script type="text/javascript">
			rechargeAmount = [[${rechargeHistory.rechargeAmount}]] / 100;
			rechargeAmountString = "Rs. " + rechargeAmount + " INR";
			$("#rechargeAmount" + [[${rechargeHistory.id}]]).text(rechargeAmountString);
		</script>
	</th:block>
</div>
 
 <footer th:replace="fragments :: page_footer"></footer>
 <script type="text/javascript" th:src="@{/js/common.js}"></script>
</body>
<link th:href="@{css/custom.css}" rel="stylesheet">
</html>
