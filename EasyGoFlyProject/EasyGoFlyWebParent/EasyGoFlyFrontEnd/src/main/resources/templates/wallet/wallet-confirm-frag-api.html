<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org 
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
		th:fragment="wallet-confirm(remove)" th:remove="${remove}">

    <script>
        $(function () {
            $("#datepicker").datepicker({ 
                    autoclose: true,
                    todayHighlight: true,
                    changeMonth: true,
                    changeYear: true
            }).datepicker('update', new Date());
        });
    </script>
    
    <style>
        .tile-align {
            float: left;
        }
        .reviews {
            padding: 10px 0;
        }
        .reviews p {
            margin: 0;
        }
        .choosen_request {
            background-color: #969393;
        }
        #time-limit {
            margin: 0px;
            padding: 0px;
            background: #f8f4a2;
        }
        .circles {
            width: 20px;
            height: 20px;
            border-radius: 10px;
            background-color: #344755;
            margin: 0 auto;
            z-index: 1;
        }
        .progress_border {
            border: 1px solid green;
            position: relative;
            bottom: 65px;
            margin: 0 auto;
            width: 68%;
            opacity: 0.3;
            z-index: -1;
        }
        .buttn_stly {
            float: right;
            width: 60%;
            vertical-align: middle;
            border-radius: 0 !important;
            padding: 8px !important;
            background-color: #ecf5fd;
        }
        .buttn_stly:hover {
            background-color: #dcdcdc;
        }
        .accordion-header {
            margin-bottom: 0;
            background-color: #ecf5fd;
        }
        .buttn_stly_eff {
            box-shadow: rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset, rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset !important;
        }
        .onward {
            margin: 15px 0;
            background-color: #1369f5;
            color: white;
            padding: 6px 11px;
            width: 10%;
            border-radius: 0 20px 20px 0;
        }
        .non_stop {
            text-align: center;
            margin: 0;
            font-size: 12px;
            color: red;
        }
        .form-floating > .bi-calendar-date + .datepicker_input + label {
            padding-left: 3.5rem;
            z-index: 3;
        }
        .dest_box {
            margin: 5px;
            text-align: center;
            background-color: #22a9bf;
            color: white;
        }
        .summary_btn_stl {
            float: left;
            background-color: white;
            width: 100%;
        }
        .booking_tiles {
            border: 1px solid #a7a7a794; 
            margin-bottom: 15px;
        }
        .booking_footer_btn {
            background-color: #d32f2f;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
        }
        .booking_footer_btn p {
            text-decoration: none;
            color: white;
            font-weight: 600;
            margin: 0;
        }
        .booking_page_off {
            display: none;
        }
        .booking_page_on {
            display: block;
        }
        .circles_active {
            background-color: #2abd2a !important;
        }
        .travelerActive {
   		    width: 970px;
   			overflow-x: hidden;
   			overflow-y: hidden;
        }
        .activeSLider:hover{
        	position: relative;
    		left: -141px;
        }
        
        .steady{
        	background-color: greean;
        	position: relative !important;
    		left: -141px !important;
        }
        
        .activeSLider{
        	width: 1160px;
        	position: relative;
        	left: 0px;
       		transition: left 0.5s;
       		transition-timing-function: ease-out;
  	    }
        .buttonSTyle {
        	    display: flex;
			    justify-content: center;
			    align-items: center;
			    height: 100%;
			    width: 65%;
        }
        .form-check-input:checked {
			background-color: #0d6efd !important;
		}
    </style>

    <body>
		<div style="background-color:#061123; padding-top: 120px;"></div>
        
        <div id="booking_page" style="margin-top: 20px;">
            <div class="container">
                <div id="payment_tab" class="" style="margin-bottom: 15px;">
                    <div class="row">
                        <div class="col-md-9" style="padding: 0;">
                            <div id="make_payment" class="booking_tiles back_white shadow">
                                <div style="background-color: #ecf5fd;">
                                    <p style="margin: 0;font-size: 16px;padding: 8px; font-weight:600;">Make Payment</p>
                                </div>
                                <div>
                                    <div class="row" style="padding-top: 20px;">
                                        
                                    </div>

                                </div>
                                <div>
                              
                                    <div class="row" style="margin: 10px 25px;">
                                    	<div class="col-12">
	                                        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" form="payment_form" required="required">
	                                        <label class="form-check-label" for="flexCheckDefault">
	                                            i have reviewed and agreed on the Terms and Condition.
	                                        </label>
                                        </div>
                                        <div class="col-12">
											<div class="row">
												<div class="col-8 col-md-10"></div>
												<div class="col-4 col-md-2">
													<div >
						                                        	<!-- 
						                           	** ZAAKPAY **  --> <!--  -->
							                           	<form th:action="@{${requestUrl}}" method="post" id="payment_form">
							                           		<input type="hidden" name="JSESSIONID" th:value="${JSESSIONID}">
							                           		<th:block th:each="orderInfo : ${entrySet}">
							                           			<input type="hidden" th:name="${orderInfo.getKey}" th:value="${orderInfo.getValue}">
							                           		</th:block>
							                           		<input type="hidden" name="checksum" th:value="${checksum}">
							                            	<input class="nir-btn white" type="submit" value="Proceed" id="payButton">
							                            </form>
						                            </div>
												</div>
											</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div id="selection_summary" class="booking_tiles">
                                    <div style="background-color: #ecf5fd;">
                                        <p style="margin: 0;font-size: 16px;padding: 8px; font-weight:600;">Selection Summary</p>
                                    </div>
                                    <div>
                                        <div class="accordion accordion-flush" id="accordionFlushExample">
                                            <div class="accordion-item">
                                                <h2 class="accordion-header" id="flush-headingOne1" style="background-color: white !important;">
                                                    <div aria-expanded="true">
                                                        <div class="row">
                                                            <div class="col-md-8">
                                                                <button class="accordion-button summary_btn_stl collapsed" type="button" aria-expanded="false" aria-controls="flush-collapseOne1" data-bs-target="#flush-collapseOne1" data-bs-toggle="collapse" id="summaries">Recharge Amount</button>
                                                            </div>
                                                            <div class="col-md-4"><p style="margin: 0;font-size: 16px;padding: 1rem 1.25rem; float: right;"><i class="fa fa-inr" aria-hidden="true"></i> [[${temp_value}]]</p></div>
                                                        </div>
                                                    </div>
                                                </h2>
                                                <div id="flush-collapseOne1" class="accordion-collapse collapse" aria-labelledby="flush-headingOne1" data-bs-parent="#accordionFlushExample">
                                                    
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                   
                                    <div style="border:1px solid grey; height: 40px; background-color: #07162d;">
                                        <h2 style=" float: left; font-size: 18px; margin: 10px 20px; color:white;">Total</h2>
                                        <div style="float: right;">
                                            <p style="margin: 0;font-size: 16px;padding: 8px 20px; color:white;"><i class="fa fa-inr" aria-hidden="true"></i> [[${temp_value}]]</p>
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    
                </div>
                
                
                
                
            </div>
        </div>
     
    </body>
     
 
    <script type="text/javascript">
    	feesCharges = 0;
    	
    	insertHtml = `<i class="fa fa-inr" aria-hidden="true"></i> ${feesCharges}`;
    
    	$("#feesAndCharges").html(insertHtml);
    
        $("#button_collapse").click(function(){
            $(this).toggleClass("buttn_stly_eff");
        })
    </script>
    <script type="text/javascript">
    	$(document).ready(function(){
		  $(".editTraveler").click(function(){
  			$("#test").removeAttr("style");
  			$("#test").removeAttr("disabled");
		  });
		});
    </script>
    <script>
	$(".connectedButton").click(function(){
		$(this).parent(".buttonSTyle").parent(".styleHHH").parent(".row").parent(".activeSLider").toggleClass("steady");
	});
     
    </script>

</html>
