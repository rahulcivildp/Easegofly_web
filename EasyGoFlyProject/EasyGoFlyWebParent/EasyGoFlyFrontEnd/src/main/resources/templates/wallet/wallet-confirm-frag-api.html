<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org 
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
		th:fragment="wallet-confirm(remove)" th:remove="${remove}">
		
	<head>
	  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
	  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	  <style>
	    body {
	      margin: 0;
	      height: 100vh;
	      background: linear-gradient(135deg, #74ebd5, #acb6e5);
	      display: flex;
	      flex-direction: column;
	      align-items: center;
	      justify-content: center;
	      font-family: 'Poppins', sans-serif;
	      color: #fff;
	      overflow: hidden;
	    }
	
	    .spinner {
	      width: 64px;
	      height: 64px;
	      border: 6px solid rgba(255, 255, 255, 0.3);
	      border-top: 6px solid #ffffff;
	      border-radius: 50%;
	      animation: spin 1s linear infinite;
	      margin-bottom: 25px;
	      box-shadow: 0 0 20px rgba(255,255,255,0.5);
	    }
	
	    @keyframes spin {
	      0% { transform: rotate(0deg); }
	      100% { transform: rotate(360deg); }
	    }
	
	    .text {
	      font-size: 1.8rem;
	      font-weight: 500;
	      animation: fadeInDown 1s ease both;
	    }
	
	    @keyframes fadeInDown {
	      from { opacity: 0; transform: translateY(-20px); }
	      to   { opacity: 1; transform: translateY(0); }
	    }
	  </style>
	</head>
	
    <body>
		
        <!-- ** ZAAKPAY **  --> 
       	<form th:action="@{${requestUrl}}" method="post" id="payment_form">
       		<input type="hidden" name="JSESSIONID" th:value="${JSESSIONID}">
       		<th:block th:each="orderInfo : ${entrySet}">
       			<input type="hidden" th:name="${orderInfo.getKey}" th:value="${orderInfo.getValue}">
       		</th:block>
       		<input type="hidden" name="checksum" th:value="${checksum}">
        </form>
		
		
		<div class="spinner animate__animated animate__rotateIn"></div>
		<div class="text animate__animated animate__fadeInUp">Please wait...</div>
						                           
    </body>
     
 
<script type="text/javascript">

	$(document).ready(function(){
		var form = $("#payment_form");
		form.submit();
	})

</script>

</html>
