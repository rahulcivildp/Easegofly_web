<body>

  <header id="header" class="fixed-top d-flex align-items-center" >
  	<div th:replace="fragments :: page_header('tag')"></div>
  </header>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  
  <div th:replace="whatsapp :: content"></div>
  
<br><br><br><br>
<div class="container" style="border: 3px solid #848cea; border-radius: 8px; margin-bottom: 20px; margin-top: 30px; box-shadow: rgb(0 0 0 / 25%) 0px 10px 20px, rgb(0 0 0 / 40%) 0px 10px 20px;">
		<div class="row">
			<div class="col-12 col-md-6">
				<div class="row" style="display: flex;justify-content: space-evenly;border: 1px solid grey;border-radius: 7px;box-shadow: rgb(0 0 0 / 25%) 0px 5px 10px, rgb(0 0 0 / 40%) 0px 5px 10px;margin: 10px 0;">
					<div class="col-8" style="display: flex; padding: 20px;">
                        <h2 style="margin: 10px;">Wallet Balance: </h2>
    					<h2 style="margin: 10px;">[[${balance}]] INR</h2>
                    </div>
                    <a class="col-4 historyt" id="historyt" th:href="@{/show-history}" style="apadding: 0; display: flex; justify-content: center; align-items: center; background: #157347f0; border-radius: 0 6px 6px 0; box-shadow: rgb(255 255 255 / 60%) -2px -2px 8px inset, rgb(254 254 254 / 39%) 4px 4px 8px inset;">
                    	<h3 id="headerH" style=" margin: 0;">Show history</h3>
                    </a>
				</div>
			</div>
			<div class="col-12 col-md-6">
				<form th:action="@{/wallet-recharge}" method="post">
						<input type="hidden" name="wallet_id" th:value="${wallet.id}">
					<div class="row" style=" padding: 20px; display: flex; justify-content: space-evenly; border: 1px solid grey; border-radius: 7px; box-shadow: rgb(0 0 0 / 25%) 0px 5px 10px, rgb(0 0 0 / 40%) 0px 5px 10px; margin: 10px 0;">
						
						<div class="form-floating col-7" style="padding: 0;">
						  <input type="number" class="form-control" id="floatingInputValue" name="recharge-amount">
						  <label for="floatingInputValue">Amount</label>
						</div>
						<div class="col-1">
						</div>
						<button type="submit" class="btn btn-success col-4">Recharge</button>
						
					</div>
				</form>
			</div>
		</div>
	</div>
 <footer th:replace="fragments :: page_footer"></footer>
 <script type="text/javascript" th:src="@{/js/common.js}"></script>
</body>
<link th:href="@{css/custom.css}" rel="stylesheet">
