<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<head th:replace="fragments :: page_head('Manage Booking ', 'tag')"></head>

</head>
<style type="text/css">
	.sections {
	background: rgb(231, 237, 254);
	border: 1px solid grey;
    padding: 15px 0;
    border-radius: 3px;
}
	.sections:hover {
	background: rgb(184, 205, 254);
}
	.contents {
	padding: 0;
	border: 1px solid grey;
    border-radius: 3px;
    width: 80% !important;
    margin: 0 auto;
    background: white;
    margin-bottom: 50px;
}
	.active{
	background: rgb(184, 205, 254);
	display: block;
	}
</style>
<body th:style="'background-image: url(' + @{'/assets/img/1971537-temp.jpg'} + ');'">
	<div style="background-color: #00000047;">
  <header id="header" class="fixed-top d-flex align-items-center" >
  	<div th:replace="fragments :: page_header('tag')"></div>
  </header>
    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  
  <div th:replace="whatsapp :: content"></div>

<div style="background-color:#061123; padding-top: 120px;"></div>
<h1 class="text-center m-2">Manage Booking</h1>
<div class=" contents shadow">
	<div class="row">
	        <div class="col-md-2">
	            <div id="accordion" >
	                <h3 class="sections" id="flightCart" style="margin: 0; display: flex; justify-content: center;"><span>Flight Cart</span></h3>
	                <h3 class="sections" id="orderList" style="margin: 0; display: flex; justify-content: center;"><span>Order List</span></h3>
	            </div>
	        </div>
	        <div class="col-md-10 hidden-groups" id="new_content1" style="padding: 10px 5px 0 0; display: none;">
				<div th:replace="cart/manage_cart_fragment :: manageBooking('tag')"></div>
	        </div>
	        <div class="col-md-10 hidden-groups" id="new_content2" style="padding: 10px 5px 0 0;">
				<div th:replace="cart/manage_order_fragment :: manageOrder('tag')"></div>
	        </div>
	    </div>

</div>
 
 

 
 <footer th:replace="fragments :: page_footer"></footer>
	</div>
</body>

<script>
    $("#flightCart").click(function() {
    	$(".sections").removeClass("active");
    	$("#flightCart").addClass("active");
    	$(".hidden-groups").css("display", "none");
        $("#new_content1").css("display", "block");
    });
    $("#orderList").click(function() {
    	$(".sections").removeClass("active");
    	$("#orderList").addClass("active");
    	$(".hidden-groups").css("display", "none");
        $("#new_content2").css("display", "block");
    });
    
    baseLink = "https://easegofly.com/";

    if(window.location.href == baseLink + "manage_booking#flightCart") {
    	$(".sections").removeClass("active");
    	$("#flightCart").addClass("active");
    	$(".hidden-groups").css("display", "none");
        $("#new_content1").css("display", "block");
    }
    
</script>
</html>
