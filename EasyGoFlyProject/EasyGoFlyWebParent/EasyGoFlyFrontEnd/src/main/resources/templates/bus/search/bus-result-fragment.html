<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
	th:fragment="bus-search-result">
	
	<head>
		
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
	</head>
	<style>
		body{
			background: rgb(242, 242, 242);
		}
		.hotelRowStyle {
			padding: 8px 0 12px 0;
			margin: 12px 0;
		    box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
		    border-radius: 10px;
		    display: flex;
		    flex-wrap: wrap;
		    justify-content: center;
		}
		.priceRowStyle {
			padding: 10px;
		    background: #e8f8e8;
		    border-radius: 8px;
		    margin-right: 6px;    
		    align-items: center;
		    height: 150px;
		}
		.priceRowStyle h4 {
			margin: 0;
		}
		
		.priceRowStyle h4 {
			margin: 0;
		}
		.priceRowMobStyle {
		    background: #f1f1f1;
		    border-radius: 8px;
		    align-items: center;
		    margin-top: 10px;
		}
		.priceRowMobStyleDropdown {
		    background: #ebecff;
		    border-radius: 8px;
		    align-items: center;
		    margin-top: 10px;
		    border: 1px solid #c4d2ff;
		}
		.colr {
			color: blue;
		}
		.colrOff {
			color: #dbdbdb;
		}
		.collapsibleClass {
			display: flex;
		    justify-content: center;
		    padding: 0 10px;
			overflow: hidden;
			width: 100%;
		    height: 0;
			transition-property: height; 
			transition-duration: 2000ms; 
			transition-timing-function: ease-in;
			-webkit-transition-property: height; 
			-webkit-transition-duration: 2000ms; 
			-webkit-transition-timing-function: ease-in;
			-ms-transition-property: height; 
			-ms-transition-duration: 2000ms; 
			-ms-transition-timing-function: ease-in;
		}
		.collapsibleToggle {
		    height: fit-content;
		}
		.collapsibleBtn {
			margin-top: 10px;
			width: 90%;
			border-radius: 8px;    
			border: 1px solid #b2c0ff;
			background: #d4ddff;
		}
		.priceRowStyleMbl {
			align-items: center;
		    border-radius: 8px;
		    background: #eaffeb;
		    margin-right: 10px;
		    border: 1px solid #97b99f;
		    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    		cursor: pointer;
		}
		.priceRowStyleMbl h4 {
			padding: 10px;
		    margin: 0;
		}
		.modifyBtnStl {
			width: 100%;
		    height: -webkit-fill-available;
		    border: none;
		    border-radius: 8px;
		    background: #c9c9ff;
		    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
		    font-size: 32px;
		    text-align: center;
		}
		.searchText {
			padding: 10px 10px;
		    background: white;
		    border-radius: 8px;
		    box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
		}
		
		.collapsibleSearch {
			overflow: hidden;
		    height: 0;
			transition-property: height; 
			transition-duration: 500ms; 
			transition-timing-function: ease-in;
			-webkit-transition-property: height; 
			-webkit-transition-duration: 500ms; 
			-webkit-transition-timing-function: ease-in;
			-ms-transition-property: height; 
			-ms-transition-duration: 500ms; 
			-ms-transition-timing-function: ease-in;
		}
		.collapsibleSearchToggle {
		    height: 290px;
		}
		.stickyStl {
			margin-top: 10px;
			padding-top: 5px;
			padding-bottom: 5px;
			background: rgb(242, 242, 242);
		}
		
	@media screen and (max-width: 800px) {
		.maiCont {
			padding-top: 5px;
		}
		.stickyStl {
			margin-top: 0;
			position: sticky;
		    top: 0;
		    z-index: 200;
		}
	}
	
	.flexStyle {
		display: flex;
		justify-content: space-around;
	}
	.iconeSt {
		height: 24px; 
		display: flex; 
		flex-direction: column; 
		justify-content: center;
	}
	</style>
	<body>
		<div class="media-hide" style="height: 65px;"></div>
		<div class="container stickyStl">
			<div class="collapsibleSearch"><div th:replace="bus/bus-search-tab :: bus-search"></div></div>
		</div>
		
		
            <div class="container" style="margin-bottom: 5px; margin-top: 10px; padding: 0;">
                <div class="shadow rounded"> 
                	<a href="https://www.webkoro.com/" title="https://www.webkoro.com/">
                    	<img th:src="@{/images/advertisement/webkoro.png}" style="width: 100%;" class="shadow rounded" > 
                    </a>
                </div>
            </div>
		<div class="container media-hide" style="padding-top: 40px;">
			<th:block th:each=" bus : ${busList}" >
				<form th:action="@{/bus/saveBus}" method="post" th:id="'busFormDesk-' + ${bus.resultIndex}">
					<input type="hidden" th:value="${bus.resultIndex}" name="resultIndex">
					<input type="hidden" th:value="${cityOne.cityName}" name="busDeparture">
					<input type="hidden" th:value="${cityTwo.cityName}" name="busDestination">
					<input type="hidden" th:value="${deptDate}" name="deptTime">
				</form>
			   <div class="hotelRowStyle">
				<div class="row" style="width: 100%;">
					<div class="col-3" style="height: inherit;">
						<img th:src="@{/images/bus/bus-removebg.png}" class="img-fluid" style="width: 100%; border-radius: 8px; height: 150px;">
					</div>
					<div class="col-5">
						<div class="">
							<h4>[[${bus.travelName}]]</h4>
							
							
							<p>[[${bus.busType}]]</p>
							<b>[[${bus.arrivalTime}]]</b>
						</div>
					</div>
					<div class="col-4">
						<div class="row priceRowStyle" style="background: #e8f8e8;">
							<div class="col-12"><b>Amenities</b><p style="color: forestgreen; font-size: 14px; margin: 0;"><i class="fa fa-solid fa-check"></i> Free Cancellation</p></div>
							<div class="col-12" style="height: 20px; color: forestgreen; font-size: 14px;"></div>
							<div class="col-12">
								<div class="row">
									<div class="col-md-6 col-12"><h4>₹ [[${bus.publishedPriceRoundedOff}]]</h4></div>
									<div class="col-md-6 col-12"><button type="submit" th:form="'busFormDesk-' + ${bus.resultIndex}" class="btn btn-success">View Deals 
										<i class="fa fa-solid fa-chevron-right"></i></button></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			</th:block>
			<th:block th:if="${errorCode} == '25'">
				<div class="text-center" style="margin-top: 15px;">
					<h4>[[${errorMessage}]]</h4>
				</div>
			</th:block>
		</div>
		<div class="container media_status" style="padding-top: 5px;">
			<th:block th:each=" bus : ${busList}">
				<form th:action="@{/bus/saveBus}" method="post" th:id="'busForm-' + ${bus.resultIndex}">
					<input type="hidden" th:value="${bus.resultIndex}" name="resultIndex">
					<input type="hidden" th:value="${cityOne.cityName}" name="busDeparture">
					<input type="hidden" th:value="${cityTwo.cityName}" name="busDestination">
					<input type="hidden" th:value="${deptDate}" name="deptTime">
				</form>
			   <div class="hotelRowStyle">
				<div class="row" style="width: 100%;">
					<div class="col-3" style="height: inherit;">
						<img th:src="@{/images/bus/bus-removebg.png}" class="img-fluid" style="width: 100%; border-radius: 8px; height: 100px;">
					</div>
					<div class="col-5">
						<div class="">
							<h4>[[${bus.travelName}]]</h4>
						
							
							<p style="margin: 0;">[[${bus.busType}]]</p>
						</div>
					</div>
					<div class="col-4" style="display: flex; align-items: center; padding: 0;">
						<button type="submit" class="priceRowStyleMbl" th:form="'busForm-' + ${bus.resultIndex}" style="width: -webkit-fill-available;">
							<div class="row ">
								<div class="col-12" style="padding: 0;">
									<div class="row">
										<div class="col-12"><h4>₹ [[${bus.publishedPriceRoundedOff}]]</h4></div>
										<div class="col-12"><div class="btn btn-success" style="width: -webkit-fill-available;">View Deals <i class="fa fa-solid fa-chevron-right"></i></div></div>
									</div>
								</div>
							</div>
						</button>
					</div>
				</div>
				
				<div >
					<div style="display: flex; justify-content: center;"><button class="collapsibleBtn">Bus Info</button></div> 
					<div class="collapsibleClass">
						<div class="row priceRowMobStyleDropdown" style="width: 100%;">
							<div class="col-12">
								<div class="row">
									<div class="col-4"><b>Address: </b></div>
								</div>
							</div>
							<div class="col-12" style="height: 15px;"></div>
							<div class="col-12">
								<div class="row">
									<div class="col-md-6 col-12"><b>Description: </b></div>
								</div>
							</div>
							<div class="col-12" style="height: 15px;"></div>
							<div class="col-12"><b>Amenities: </b><p style="color: forestgreen; font-size: 14px; margin: 0;"><i class="fa fa-solid fa-check"></i> Free Cancellation</p></div>
							<div class="col-12" style="height: 15px;"></div>
							<div class="col-12">
								<div class="row">
									<div class="col-md-6 col-12"><b>Bus Supplier: </b></div>
									<div class="col-md-6 col-12">
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		  	
			</th:block>
			<th:block th:if="${errorCode} == '25'">
				<div class="text-center" style="margin-top: 15px;">
					<h4>[[${errorMessage}]]</h4>
				</div>
			</th:block>
		</div>
		
	</body>
	<script th:inline="javascript">
		$(".collapsibleBtn").click(function(){
			$(this).parent().next().toggleClass("collapsibleToggle");
		});
	</script>
	<script>
		$("#btnModify").click(function(){
			$(".collapsibleSearch").toggleClass("collapsibleSearchToggle");
		});
	</script>
</html>
