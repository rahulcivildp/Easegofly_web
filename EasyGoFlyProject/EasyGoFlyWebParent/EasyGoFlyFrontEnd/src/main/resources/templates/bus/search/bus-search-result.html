<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
	<head th:replace="fragments :: page_head(': Bus Search Result', 'tag')"></head>

</head>	
<style>
	@media screen and (max-width: 800px) {
		body #header {
			position: relative;
		}
	}
	gmp-map {
		width: 60%;
        height: 70vh;
      }
</style>
<body>
<div class="hide-lg">
		<!-- Preloader -->
		<div id="preloader">
		    <div id="status"></div>
		</div>
		<!-- Preloader Ends -->
		
		<!-- header starts -->
	   
	    <header class="main_header_area">
			<div th:replace="nav-fragment :: page_header('tag')"></div>
		</header>
	    <!-- header ends -->
  
	</div>


	<div class="hide-mobile btndeactive scrollbar-hidden">
		<main class="home">
			<div th:replace="nav-fragment :: page_header_mobile('tag')"></div>
		</main>
	</div>

  <div th:replace="whatsapp :: content"></div>
  
    <!-- BreadCrumb Starts -->  
    <section class="breadcrumb-main pb-4 pt-3" th:style="'background-image: url(' + @{/assets/images/bg/bg1.jpg} + ');'">
        <div class="section-shape section-shape1 top-inherit bottom-0" th:style="'background-image: url(' + @{/assets/images/shape8.png} + ');'"></div>
        <div class="breadcrumb-outer">
            <div class="container pb-2">
                <div class="breadcrumb-content text-center">
                    <nav aria-label="breadcrumb" class="d-block">
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/bus}">Bus</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Bus List</li>
                        </ul>
                    </nav>
                </div>
            </div>
			<div class="d-flex justify-content-center mb-2">
				<div class="bg-white p-4 radius-8 hide-lg">
	            	<p class="card-text d-flex"><span> [[${cityOne.cityName}]] | [[${cityTwo.cityName}]] | [[${#dates.format(checkIn, 'dd MMMM, yy')}]] </span> 
						<button id="btnModify" class="ps-4" style="width: fit-content;">
							<i class="fa fa-solid fa-pen-to-square"></i>
						</button></p>
				</div>
				<div class="bg-white p-4 radius-8 text-center hide-mobile btndeactive">
	            	<p class="card-text"><span> [[${cityOne.cityName}]] | [[${cityTwo.cityName}]] </span></p>
	            	<p class="card-text"><span> [[${#dates.format(checkIn, 'dd MMM, yy')}]] </span></p>
				</div>
			</div>
        </div>
        <div class="dot-overlay"></div>
    </section>
    <!-- BreadCrumb Ends --> 
    
  
  <div th:replace="bus/search/bus-result-fragment :: bus-search-result"></div>
  
  <!--<div>
	 <gmp-map center="24.07638888888888,88.26158333333333" zoom="4" map-id="DEMO_MAP_ID">
      <gmp-advanced-marker position="24.07638888888888,88.26158333333333" title="My location"></gmp-advanced-marker>
    </gmp-map>
  </div>-->
 
	<div class="media_status" id="mobileFooter">
		<div class="footerInner justify_center_div footer_btn_style">
	   	   <div class="row">
			   <button class="col-6 bottomFooter bottomFooterStl" id="homeFooter" onclick="history.back()">
				   <div class="footerFragInnerDiv" style="color: white;">
					   <i class="fa fa-solid fa-backward"></i><br>
			   		</div>
			   	</button>
			   <button class="col-6 bottomFooter bottomFooterStl" id="homeFooterNext" disabled>
				   <div class="footerFragInnerDiv" style="color: #b1b1b1;">
					   <i class="fa fa-solid fa-forward"></i>
			   		</div>
			   	</button>
		   </div>
	   </div>
   </div>

 	<footer th:replace="fragments :: page_footer_only('tag')"></footer>
	
 <script type="text/javascript" th:src="@{/js/common.js}"></script>
</body>
<link th:href="@{/css/custom.css}" rel="stylesheet">
</html>
