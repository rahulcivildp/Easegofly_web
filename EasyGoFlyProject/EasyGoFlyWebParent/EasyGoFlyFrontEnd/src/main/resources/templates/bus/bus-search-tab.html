<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
	th:fragment="bus-search">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
</head>
<style>
	.ripple-effect {
	  position: relative;
	  overflow: hidden;
	  -webkit-transform: translate3d(0, 0, 0);
	}
	
	.btn-stle {
	  padding: 8px 20px;
	  border-radius: 8px !important;
	  background: #ff093d;
	  color: white;
	}
	.btn-stle:hover{
		color:  #ff093d;
	  	border: 2px solid #ff093d;
	  	background: white;
	}
	
	.search-div {
		border-radius: 12px;
		border: 1px solid rgb(183, 183, 183);
		padding: 15px;
		margin: 14px 0 10px;
		background: white;
	}
input {
	background: white !important;
}
</style>

<body>
        <div class="search-div search-tags-mb">
			<form method="post" th:action="@{/bus/saveSearchBus}">
            <div class="row justify-content-between align-items-center">
                <div class="col col-md-3 col-sm-3 col-lg-3 col-6">
                    <div class="form-floating"><input type="text" class="form-control" name="busDeparture"  id="busDeparture" required><label class="form-label" for="floatingInput"  >Departure</label></div>
                </div>
                <div class="col col-md-3 col-sm-3 col-lg-3 col-6">
                    <div class="form-floating"><input type="text" class="form-control" name="busDestination" id="busDestination" required><label class="form-label" for="floatingInput" >Destination</label></div>
                </div>
                <div class="col col-md-3 col-sm-3 col-lg-3 col-12">
					<div class="form-floating" id="aligner3" style="padding: 10px 0;">
						<input type="text" class="form-control hill1 input_styles" name="deptTime" id="checkInDate" onfocus="(this.type='date')" onblur="(this.type='text')" onclick="calenderViewNew(this)" required>
						<label class="labelStyle labelSetting" for="checkInDate">Dept-Time</label>
					</div>
				</div>
                <div class="col col-md-3 col-sm-3 col-lg-3 col-12">
                    <div>
                        <div class="text-center"><button class="btn btn-lg rounded-0 ripple-effect btn-stle" type="submit"><i class="fa fa-solid fa-magnifying-glass"></i>&nbsp;Submit Bus</button></div>
                    </div>
                </div>
            </div>
            </form>
        </div>
    <script th:src="@{js/Button-Ripple-Effect-Animation-Wave-Pulse-button-ripple-effect.js}"></script>
</body>
<script>
		function calenderViewNew(input) {
			var today = new Date().toISOString().split('T')[0];
			$(input).attr('min', today);
		};
		
	</script>
	<script th:inline="javascript">
		var cityNames = [[${cityList}]];
		var cityIds = [[${cityIds}]];
		
		var myInput = document.getElementById("busDeparture");
		var myInputDestin = document.getElementById("busDestination");
	</script>
<script type="text/javascript" th:src="@{js/busCityAuto.js}"></script>
</html>
