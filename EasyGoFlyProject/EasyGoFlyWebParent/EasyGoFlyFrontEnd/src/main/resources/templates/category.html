<!DOCTYPE html>

<html xmlns:th=http://www.thymeleaf.org 
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
th:fragment="category(remove)" th:remove="${remove}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet"
	href="https://code.jquery.com/ui/1.13.0/themes/base/jquery-ui.css">
<link rel="stylesheet" href="/resources/demos/style.css">

<script src="https://code.jquery.com/jquery-3.6.0.js"></script>
<script src="https://code.jquery.com/ui/1.13.0/jquery-ui.js"></script>

<style type="text/css">
@media screen and (max-width: 800px) {
	.tabss {
		margin: 2px !important;
		padding: 3px 10px !important;
	}
	#adjusted {
		width: 100% !important;
	}
	#searchBox {
		width: 95% !important;
		margin-top: 50px !important;
	}
	.aligner {
		border: none !important;
	}
	.tile_settings {
		width: 100% !important;
	}
}

@media ( min-width : 576px) {
	.container, .container-sm {
		max-width: 100% !important;
	}
}

.tabss {
	background: white;
	margin: 12px;
	padding: 3px 15px;
	border-radius: 5px;
	display: inline-block;
}

.tabss:hover {
	position: relative;
	top: -8px;
	background: #D32F2F;
	box-shadow: 0 1rem 3rem rgba(0, 0, 0, .175) !important;
}

.tabss:hover a {
	color: white;
}

.tabss a {
	color: black;
	text-decoration: none;
}

#imgbck {
	position: relative;
    width: 100%;
    padding-bottom: 30px;
    margin: 0 auto;
    width: 80%;
    z-index: 2 !important;
    margin-top: -369px;
}

#adjusted {
	list-style-type: none;
	width: 70%;
	margin: 0 auto;
	text-align: center;
	height: 48px;
	padding: 0;
}

.activated {
	background: #D32F2F !important;
}

.activated a {
	color: white !important;
}

#searchBox {
	border-radius: 10px;
	background: white;
	margin: 0 auto;
	width: 80%;
	padding: 18px;
	padding-top: 33px;
	margin-bottom: 30px;
}

.empty1 {
	border-radius: 26px;
	border: 1px solid gray;
	margin-top: 10px;
	padding: 12px 0;
}

#radio_search_1 {
	width: 98%;
	margin: 0 auto;
	margin-top: 5px;
	margin-bottom: 5px;
}

#radio_search_2 {
	width: 98%;
	margin: 0 auto;
	margin-top: 5px;
	margin-bottom: 5px;
}

.radio_search {
	display: none;
}

.aligner {
	float: left;
	margin: 6px 0px;
}

.tile_settings {
	width: 80%;
	margin: 0 auto;
}

.tile_settings p {
	margin-bottom: 6px;
}

.dropdown ul {
	list-style: none;
	padding: 5px 5px;
	border: 1px solid gray;
	width: 195px;
	box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
	position: absolute;
	background: white;
}

.pass_list {
	width: 100%;
}

.dropdowns-menu p {
	margin-left: 4px;
	color: gray;
	float: left;
}

.dropdowns-menu {
	display: none;
}

.dropdowns-menu b {
	float: left;
}

.radios {
	cursor: pointer;
	float: left;
	margin: 0 7px;
}

.radios input {
	cursor: pointer;
}

input:checked+br+label {
	font-weight: 600;
}

.pass_list1 {
	width: 100%;
}

.pass_list2 {
	width: 100%;
}

.pass_list3 {
	width: 100%;
}

.pass_list4 {
	width: 100%;
}

.pass_list5 {
	width: 100%;
}

.pass_list6 {
	width: 100%;
}

.pass_list-1 {
	width: 100%;
}

.pass_list-2 {
	width: 100%;
}

.n-text {
	display: block;
	font-size: 18px;
	margin: 19px 0;
}

.submit_btns {
	width: 100%;
	height: 62px;
	border-radius: 9px;
	background-color: #faff69;
	font-size: 24px;
	font-weight: 630;
	box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0
		rgba(0, 0, 0, 0.19);
}

.submit_btns:hover {
	background-color: #d32f2f;
	position: relative;
	top: 2px;
	box-shadow: 0 12px 24px 0 rgba(0, 0, 0, 0.2), 0 18px 60px 0
		rgba(0, 0, 0, 0.19);
	color: white;
}

#hero{height: auto;
}
.carousel-inner-cont {
	height: 527px;
	position: relative !important;
	width: 100% !important;
	overflow: hidden !important;
}
@media only screen and (max-width: 600px) {
.carousel-inner-cont {
	height: auto !important;
}
}
#imgbck2 {
	padding: 65px 0 30px 0;
    margin: 0 auto;
    width: 80%;
    z-index: 2 !important;
}
</style>

</head>
<body>
	<div style="height: auto; position: relative;" >
		<!-- ======= Hero Section ======= -->
		<section id="hero">
			<div class="hero-container">
				<div id="heroCarousel" data-bs-interval="5000"
					class="carousel slide carousel-fade" data-bs-ride="carousel">

					<div class="carousel-indicators" id="hero-carousel-indicators">
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="0" class="active" aria-current="true"
							aria-label="Slide 1"></button>
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="1" aria-label="Slide 2"></button>
						<button type="button" data-bs-target="#carouselExampleIndicators"
							data-bs-slide-to="2" aria-label="Slide 3"></button>
					</div>

					<div class="carousel-inner carousel-inner-cont" role="listbox">

						<!-- Slide 1 -->
						<div class="carousel-item active"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-1.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

						<!-- Slide 2 -->
						<div class="carousel-item"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-2.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

						<!-- Slide 3 -->
						<div class="carousel-item"
							th:style="'background-image: url(' + @{'/assets/img/slide/slide-2.jpg'} + ');'">
							<div class="carousel-container">
								<div class="carousel-content">
									<div></div>
								</div>
							</div>
						</div>

					</div>

					<a class="carousel-control-prev" href="#heroCarousel" role="button"
						data-bs-slide="prev"> <span
						class="carousel-control-prev-icon bi bi-chevron-left"
						aria-hidden="true"></span>
					</a> <a class="carousel-control-next" href="#heroCarousel"
						role="button" data-bs-slide="next"> <span
						class="carousel-control-next-icon bi bi-chevron-right"
						aria-hidden="true"></span>
					</a>

				</div>
			</div>
		</section>
		<!-- End Hero -->

		<div style="padding-top: 81px;">
			<div class="col-1 float-right" style="color: white; font-size: 20px; font-weight: 600; margin: 10px;">
		        <p></p>
		    </div>
			<th:block  sec:authorize="hasAnyAuthority('Customer', 'ROLE_USER')">
			    <div class="col float-state" style="color: white; font-size: 20px; font-weight: 600;">
			        <p class="float-state" >Welcome : <span sec:authentication="principal.fullName"></span></p>
			    </div>
		    </th:block>
		    	
			<div id="imgbck2" class="div_resizer">
	
				<div id="tabs" class="col-12">
					<ul class="text-center" id="adjusted">
						<li class="tabss shadow activated" id="flight"><a
							href="${pageContext.request.contextPath}"><i
								class="fa fa-bath" aria-hidden="true"></i><br>Flight</a></li>
						<li class="tabss shadow" id="train"><a
							th:href="@{/hotel}"><i
								class="fa fa-id-card" aria-hidden="true"></i><br>Hotel</a></li>
						<li class="tabss shadow" id="hotel"><a
							href="${pageContext.request.contextPath}/hotel"><i
								class="fa fa-snowflake-o" aria-hidden="true"></i><br>Bus</a></li>
						<li class="tabss shadow" id="holidays"><a
							href="${pageContext.request.contextPath}"><i
								class="fa fa-handshake-o" aria-hidden="true"></i><br>Holidays</a></li>
					</ul>
				</div>
				<div th:replace="flight/air-search :: air-search"></div>
	
			</div>
		</div>
	</div>
</body>


<script>
	
</script>
</html>
