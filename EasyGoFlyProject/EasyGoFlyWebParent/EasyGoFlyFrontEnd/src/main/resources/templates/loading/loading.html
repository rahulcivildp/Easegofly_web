<style type="text/css">
	#loading-label {
		animation: changeColor 2s infinite linear(0 0%, 1 100%);
	}
	
	@keyframes changeColor {
		from {
			color: rgb(166, 210, 255);
		}
		20% {
		    color: rgb(255, 255, 255);
		}
		20% {
		    color: rgb(255, 136, 136);
		}
		20% {
		    color: rgb(255, 255, 255);
		}
		to {
		    color: rgb(166, 210, 255);
		}
	}
	
</style>
