		function showCalnedarFare() {					
			const apiminimumfare = document.getElementById("calendarFare");
			const futureDate = new Date();
			futureDate.setDate(futureDate.getDate() + 15);
			const formattedDate = futureDate.toISOString().split('T')[0];
			// Define month names
			const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

			
			const formUrl = "[[@{/api/flight/tbo-search/calendar-fare}]]";
			var cityOne = $("#cityOne").val();
			var cityTwo = $("#cityTwo").val();
			var journeyClass = "1";
			var searchDate = formattedDate;
			
			const requestDataCalender = {
				journey_class: journeyClass,
				origin: cityOne,
				destination: cityTwo,
				preferredDepartureTime: searchDate
			};
			
			fetch(formUrl, {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(requestDataCalender)
			}).then(response => {
				if (!response.ok) {
					throw new Error("Network response was not ok");
				}
				return response.json();
			}).then(data => {
				apiminimumfare.innerHTML = ``;
				console.log(data);
				data.Response.SearchResults.forEach(flight => {
					const listDivFare = document.createElement("div");
					const dateNew = new Date(flight.DepartureDate);
					// Format as "dd MMM"
					const formattedDateInside = dateNew.getDate().toString().padStart(2, '0') + ' ' + monthNames[dateNew.getMonth()];

					listDivFare.innerHTML = `<div class="text-center white"	style="width: 70px;border-radius: 10px;box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;padding: 1px 3px;background: #9d9d9d;">
												<p>${formattedDateInside}</p>
												<p>₹${Math.round(parseFloat(flight.Fare))}</p>
											</div>	`;
					
					apiminimumfare.appendChild(listDivFare);
					
				});
			}).catch(error => {
				console.error("Fetch error:", error);
			});
		}
	</script>

	<script>
		// jQuery for selecting a flight card
		$(document).ready(function () {
			$(".flight-card").click(function () {
				$(".flight-card").removeClass("selected");

				if ($(this).find(".radio-input").prop("checked")) {
					$(this).removeClass("selected");
					$(this).find(".radio-input").prop("checked", false);
				} else {
					$(this).addClass("selected");
					$(this).find(".radio-input").prop("checked", true);
				}
			});

		});

		function filterButton() {
			filterFlight = true;
			var currentMin = $(".current-min").val();
			var currentMax = $(".current-max").val();
			var dayTimeInput = document.querySelector(".flight-card input[type='radio']:checked")?.value || "";
			var airLineInput = document.querySelector(".airline-type input[type='radio']:checked")?.value || "";
			var stopsTypeInput = document.querySelector(".stops-type input[type='radio']:checked")?.value || "";

			searchFlight(airLineInput, dayTimeInput, currentMin, currentMax, stopsTypeInput, filterFlight, sortValue, pagenum);
		}

		function sortBySelect(id) {
			var currentMin = $(".current-min").val();
			var currentMax = $(".current-max").val();
			var dayTimeInput = document.querySelector(".flight-card input[type='radio']:checked")?.value || "";
			var airLineInput = document.querySelector(".airline-type input[type='radio']:checked")?.value || "";
			var stopsTypeInput = document.querySelector(".stops-type input[type='radio']:checked")?.value || "";
			sortValue = $(id).val();

			searchFlight(airLineInput, dayTimeInput, currentMin, currentMax, stopsTypeInput, filterFlight, sortValue, pagenum);
		}

		function showMoreFlights() {
			var currentMin = $(".current-min").val();
			var currentMax = $(".current-max").val();
			var dayTimeInput = document.querySelector(".flight-card input[type='radio']:checked")?.value || "";
			var airLineInput = document.querySelector(".airline-type input[type='radio']:checked")?.value || "";
			var stopsTypeInput = document.querySelector(".stops-type input[type='radio']:checked")?.value || "";
			pagenum = pagenum + 1

			searchFlight(airLineInput, dayTimeInput, currentMin, currentMax, stopsTypeInput, filterFlight, sortValue, pagenum);
		}
	</script>

				/*Lease Flight Search*/

				fetch('/api/flight/leastFare')
					.then(response => response.json()) // Convert response to JSON
					.then(leastFlight => {
						console.log(leastFlight); // Check if data is correct
						showLeastFare.innerHTML = ""; // Clear previous results

						if (leastFlight.length === 0) {
							showLeastFare.innerHTML = "<li>No least fare found.</li>";
							return;
						}
						
						leastFlight.forEach(least => {						
							const listLeastFare = document.createElement("div");
							listLeastFare.classList.add("me-2");

							var totalAdultPriceLeast = (least.priceADT + least.markupADT) * (adultNum + childNum);
							var totalInfantPriceLeast = (least.priceINF + least.markupINF) * infantNum;
							var totalPriceLeast = totalAdultPriceLeast + totalInfantPriceLeast;

							listLeastFare.innerHTML = `	
													<form action="/flight_booking_save" method="post">
														<input type="hidden" name="timeRemaining" class="timeRemain">
														<input type="hidden" name="adultNum" value="${adultNum}">

																<div class="position-absolute bottom-0 text-center" style="left: 0; right: 0; background: #494949ba; color: white;">₹${totalPriceLeast}</div>
										                    </button>
										                </div>
													</form>`;

							showLeastFare.appendChild(listLeastFare);
						});
						showLeastFare.classList.add("attract-slider");
						//initSlider();
					})
					.catch(error => console.error('Error fetching least fare:', error));

				})
				.catch(error => {
					console.error("There was a problem with the fetch operation:", error);
				});

	<script>
		function setTravelerDetails(btn, formData) {
			var nText = $(btn).children(".n-text");
			var optionList = $(formData + " select");
			var paxCount = 0;
			var journeyType = "";
			nText.empty();

			$.each(optionList, function (index, value) {
				if (index == 0) {
					journeyType = value.value;
				} else {
					paxCount = paxCount + parseInt(value.value);
				}
			})

			nText.text(journeyType + " Pax " + paxCount);
		}
	</script>
