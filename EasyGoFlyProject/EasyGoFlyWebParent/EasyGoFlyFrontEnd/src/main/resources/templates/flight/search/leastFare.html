<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<div th:fragment="content" th:remove="tag">
		<div class="container">
		
			<div class="d-flex justify-content-center mb-2">
				<div class="bg-white py-2 px-3 radius-8 hide-lg">
	            	<p class="card-text"><span> [[${cityOneName}]] | [[${cityTwoName}]] | [[${passengerNum}]] Pax | [[${#dates.format(date, 'dd MMM, yy')}]]</span></p>		
				</div>
				<div class="bg-white py-2 px-3 radius-8 text-center hide-mobile btndeactive">
	            	<small class="card-text"><span> [[${cityOneName}]] | [[${cityTwoName}]] | [[${passengerNum}]] Pax | [[${#dates.format(date, 'dd MMM, yy')}]] | T <b style="color: #c4332f;">-</b><b id="timer-mob" style="color: #c4332f;"></b></span></small>
				</div>
			</div>				
			<div class="d-flex justify-content-center hide-lg">			
				<small class="m-0">Time Remaining : <b id="timer" style="color: #c4332f;"></b></small>
			</div>		
		
	        <div class="d-flex leastFareClass" id="leastFareId"></div>
     	</div>
	</div>
</body>
</html>
