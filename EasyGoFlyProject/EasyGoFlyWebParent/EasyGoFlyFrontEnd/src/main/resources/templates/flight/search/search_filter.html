<script type="text/javascript">
  $(".searchboxess").bind('keydown', function(e){
       var targetValue = $(this).val();
       if (e.which ===8 || e.which === 13 || e.which === 37 || e.which === 39 || e.which === 46) { return; }

       if (e.which > 47 &&  e.which < 58  && targetValue.length < 2) {
          var c = String.fromCharCode(e.which);
          var val = parseInt(c);
          var textVal = parseInt(targetValue || "0");
          var result = textVal + val;

          if (result < 0 || result > 99) {
             e.preventDefault();
          }

          if (targetValue === "0") {
            $(this).val(val);
            e.preventDefault();
          }
       }
       else {
           e.preventDefault();
       }
    });
</script>
<script>
    $(document).ready(function(){
        if ($(".searchboxess").val() <= 2){
            var dec = parseFloat($(".searchboxess").val(),10).toFixed(2);

<script>

    var slider = document.getElementsByClassName("myRange");
    var output = document.getElementsByClassName("searchboes");
    output.value = slider.value;
    
    slider.oninput = function() {
    output.value = this.value;
    var value = (this.value-this.min)/(this.max-this.min)*100
    this.style.background = 'linear-gradient(to right, #82CFD0 0%, #82CFD0 ' + value + '%, #cccccc ' + value + '%, #cccccc 100%)'
    }

    /* alert($("input[name = 'brand']").val());
    alert($("input[name = 'stop']").val()); */
</script>

<script>

    var searchPrice = document.getElementsByClassName("myRange");
    var priceSelector = document.getElementsByClassName("searchboes");
    var searchbutton = document.getElementsByClassName("searchbutton");

    searchbutton.onclick = function() {
    searchPrice.value = priceSelector.value;
    var value = (priceSelector.value-searchPrice.min)/(searchPrice.max-searchPrice.min)*100
    searchPrice.style.background = 'linear-gradient(to right, #82CFD0 0%, #82CFD0 ' + value + '%, #cccccc ' + value + '%, #cccccc 100%)'
    }

</script>

<script type="text/javascript">
	$(".time_tiles").click(function(){
		$(".time_tiles").removeClass("activeTime");
		$(".time_tiles").children("div.input").html("");
		$(this).addClass("activeTime");
		const myArray = $(this).children("div.showTime").text().split(" - ");
		const myArrayChildDep = myArray[1].split(":");
		const myArrayChildArr = myArray[0].split(":");
		var combinedTime = myArrayChildArr[0] + ":" + myArrayChildDep[0];
		$(this).children("div.input").html("<input type='hidden' name='activeTime' value='" + combinedTime + "'>");
	})

</script>
