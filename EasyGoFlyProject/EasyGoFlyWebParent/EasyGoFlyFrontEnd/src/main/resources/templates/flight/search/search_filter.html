<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
	
<head>
</head>	
<body>
	<div th:fragment="content" th:remove="tag">
		<div class="border radius-8 shadow px-4 py-2">
			
			<div class="sidebar-item mb-4">
			    <h4 class="sidebar-item-txt">Price Range</h4>
			    <div class="range-slider mt-0">
			        <div data-min="0" data-max="2000" data-unit="$" data-min-name="min_price" data-max-name="max_price" class="range-slider-ui ui-slider ui-slider-horizontal ui-widget ui-widget-content ui-corner-all" aria-disabled="false">
			            <span class="min-value">[[${CURRENCY_SYMBOL}]]0</span> 
			            <span class="max-value">[[${CURRENCY_SYMBOL}]]40000</span>
			            <div class="ui-slider-range ui-widget-header ui-corner-all full" style="left: 0%; width: 100%;"></div>
			        </div>
			        <div class="clearfix"></div>
			    </div>
			</div>
			<div class="d-flex justify-content-between sidebar-item mb-4">
				<div>
				    <h4 class="">Stops Type</h4>
				    <ul class="sidebar-category1">
				        <li><input type="checkbox" checked> Nonstop </li>
				        <li><input type="checkbox"> 1 Stop </li>
				        <li><input type="checkbox"> 2+ Stops </li>
				    </ul>
				</div>
				<div>
				    <h4 class="">Cabin Type</h4>
				    <ul class="sidebar-category1">
				        <li><input type="checkbox" checked> Basic Economy </li>
				        <li><input type="checkbox"> Economy </li>
				        <li><input type="checkbox"> Mixed </li>
				        <li><input type="checkbox"> Business </li>
				    </ul>
				</div>
			</div>
			<div class="sidebar-item mb-4">
			    <h4 class="sidebar-item-txt">Airlines</h3>
			    <ul class="sidebar-category1">
			        <li class="d-flex justify-content-between align-items-center w-100">
						<div><input type="checkbox"> SpiceJet </div>
				        <span class="float-end">
							<th:block th:each="br : ${brands}">
								<th:block th:if="${br.name} == 'SpiceJet'">
									<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
								</th:block>
							</th:block>
						</span>
					</li>
			        <li class="d-flex justify-content-between align-items-center w-100">
						<div><input type="checkbox"> Air India </div>
				        <span class="float-end">
							<th:block th:each="br : ${brands}">
								<th:block th:if="${br.name} == 'air india'">
									<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
								</th:block>
							</th:block>
						</span>
					</li>
			        <li class="d-flex justify-content-between align-items-center w-100">
						<div><input type="checkbox"> Air India Express </div>
				        <span class="float-end">
							<th:block th:each="br : ${brands}">
								<th:block th:if="${br.name} == 'Air India Express'">
									<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
								</th:block>
							</th:block>
						</span>
					</li>
			        <li class="d-flex justify-content-between align-items-center w-100">
						<div><input type="checkbox"> Air Asia Airway </div>
				        <span class="float-end">
							<th:block th:each="br : ${brands}">
								<th:block th:if="${br.name} == 'Acer'">
									<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
								</th:block>
							</th:block>
						</span>
					</li>
			        <li class="d-flex justify-content-between align-items-center w-100">
						<div><input type="checkbox"> Indigo </div>
				        <span class="float-end">
							<th:block th:each="br : ${brands}">
								<th:block th:if="${br.name} == 'indigo'">
									<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
								</th:block>
							</th:block>
						</span>
					</li>
			    </ul>
			</div>
		</div>
	</div>
</body>	
</html>
