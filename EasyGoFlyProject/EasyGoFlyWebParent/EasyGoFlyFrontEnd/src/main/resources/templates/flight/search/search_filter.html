<!DOCTYPE html>
<html xmlns:th=http://www.thymeleaf.org
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
	
<head>
</head>	
<body>
	<div th:fragment="content" th:remove="tag">
		<div class="border radius-8 shadow px-4 py-2 bg-white">
			<div class="sidebar-item mb-4">
				<div class="d-flex justify-content-between align-items-start">
					<div>
						<h4 class="sidebar-item-txt">Airlines</h3>
						<ul class="list-group">
					        <li class="list-group-item airline-type">
					            <label class="w-100 d-flex justify-content-between aling-items-center">											
									<div><input type="radio" name="airline" value="SpiceJet"> SpiceJet</div>										
									<th:block th:each="br : ${brands}">
									<th:block th:if="${br.name} == 'SpiceJet'">
										<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
									</th:block>
									</th:block>
					            </label>
					        </li>
					        <li class="list-group-item airline-type">
					            <label class="w-100 d-flex justify-content-between aling-items-center">									
									<div><input type="radio" name="airline" value="Air India"> Air India</div>										
									<th:block th:each="br : ${brands}">
									<th:block th:if="${br.name} == 'air india'">
										<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
									</th:block>
									</th:block>
					            </label>
					        </li>
					        <li class="list-group-item airline-type">
					            <label class="w-100 d-flex justify-content-between aling-items-center">									
									<div><input type="radio" name="airline" value="Air India Express"> Air India Express</div>										
									<th:block th:each="br : ${brands}">
									<th:block th:if="${br.name} == 'Air India Express'">
										<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
									</th:block>
									</th:block>
					            </label>
					        </li>
					        <li class="list-group-item airline-type">
					            <label class="w-100 d-flex justify-content-between aling-items-center">									
									<div><input type="radio" name="airline" value="Vistara"> Vistara</div>										
									<th:block th:each="br : ${brands}">
									<th:block th:if="${br.name} == 'Vistara'">
										<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
									</th:block>
									</th:block>
					            </label>
					        </li>
					        <li class="list-group-item airline-type">
					            <label class="w-100 d-flex justify-content-between aling-items-center" >
									<div><input type="radio" name="airline" value="Indigo"> Indigo</div>										
									<th:block th:each="br : ${brands}">
										<th:block th:if="${br.name} == 'indigo'">
											<img th:src="@{${br.photosImagePath}}" width="30" height="30" style="border-radius: 7px;">
										</th:block>
									</th:block>
					            </label>
					        </li>
					    </ul>
					</div>
					<div>
					   <h4 class="sidebar-item-txt">Stops Type</h4>
					   <ul class="list-group">
				           <li class="list-group-item stops-type">
				               <label>
				                   <input type="radio" name="stops" value="0"> Nonstop
				               </label>
				           </li>
				           <li class="list-group-item stops-type">
				               <label>
				                   <input type="radio" name="stops" value="1"> 1 Stop
				               </label>
				           </li>
				           <li class="list-group-item stops-type">
				               <label>
				                   <input type="radio" name="stops" value="2"> 2+ Stops
				               </label>
				           </li>
				       </ul>
					</div>				   
				</div>
			</div>
			
			<div class="d-flex justify-content-between sidebar-item mb-4">
				<div>
				    <h4 class="sidebar-item-txt">Day Time</h4>
					<div class="container mt-5">
				       <div class="row">
				           <!-- Morning Flight Card -->
				           <div class="col-md-3 px-0">
				               <div class="flight-card morning">
									<input type="radio" name="flight-time" value="08:00" class="radio-input flight-time">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-brightness-high" viewBox="0 0 16 16">
									  <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
									</svg>
				                   <p>08:00 AM</p>
				               </div>
				           </div>
				
				           <!-- Afternoon Flight Card -->
				           <div class="col-md-3 px-0">
				               <div class="flight-card afternoon">
									<input type="radio" name="flight-time" value="14:00" class="radio-input flight-time">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-cloud-sun" viewBox="0 0 16 16">
									  <path d="M7 8a3.5 3.5 0 0 1 3.5 3.555.5.5 0 0 0 .624.492A1.503 1.503 0 0 1 13 13.5a1.5 1.5 0 0 1-1.5 1.5H3a2 2 0 1 1 .1-3.998.5.5 0 0 0 .51-.375A3.5 3.5 0 0 1 7 8m4.473 3a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5z"/>
									  <path d="M10.5 1.5a.5.5 0 0 0-1 0v1a.5.5 0 0 0 1 0zm3.743 1.964a.5.5 0 1 0-.707-.707l-.708.707a.5.5 0 0 0 .708.708zm-7.779-.707a.5.5 0 0 0-.707.707l.707.708a.5.5 0 1 0 .708-.708zm1.734 3.374a2 2 0 1 1 3.296 2.198q.3.423.516.898a3 3 0 1 0-4.84-3.225q.529.017 1.028.129m4.484 4.074c.6.215 1.125.59 1.522 1.072a.5.5 0 0 0 .039-.742l-.707-.707a.5.5 0 0 0-.854.377M14.5 6.5a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1z"/>
									</svg>
				                   <p>02:00 PM</p>
				               </div>
				           </div>
				
				           <!-- Evening Flight Card -->
				           <div class="col-md-3 px-0">
				               <div class="flight-card evening">
									<input type="radio" name="flight-time" value="19:00" class="radio-input flight-time">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-sunset" viewBox="0 0 16 16">
									  <path d="M7.646 4.854a.5.5 0 0 0 .708 0l1.5-1.5a.5.5 0 0 0-.708-.708l-.646.647V1.5a.5.5 0 0 0-1 0v1.793l-.646-.647a.5.5 0 1 0-.708.708zm-5.303-.51a.5.5 0 0 1 .707 0l1.414 1.413a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707zm11.314 0a.5.5 0 0 1 0 .706l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zM8 7a3 3 0 0 1 2.599 4.5H5.4A3 3 0 0 1 8 7m3.71 4.5a4 4 0 1 0-7.418 0H.499a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/>
									</svg>
				                   <p>07:00 PM</p>
				               </div>
				           </div>
				
				           <!-- Night Flight Card -->
				           <div class="col-md-3 px-0">
				               <div class="flight-card night">							
									<input type="radio" name="flight-time" value="01:00" class="radio-input  flight-time">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-moon-stars" viewBox="0 0 16 16">
									  <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/>
									  <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/>
									</svg>
				                   <p>01:00 AM</p>
				               </div>
				           </div>
				       </div>
				   </div>
				</div>
			</div>
			<div class="sidebar-item mb-4">
			    <h4 class="sidebar-item-txt">Price Range</h4>
			    <div class="range-slider mt-0">
			        <div data-min="1500" data-max="100000" data-unit="₹" data-min-name="min_price" data-max-name="max_price" class="range-slider-ui ui-slider ui-slider-horizontal ui-widget ui-widget-content ui-corner-all" aria-disabled="false">
			            <span class="min-value">₹1500</span> 
			            <span class="max-value">₹100000</span>
						<input type="hidden" class="current-min" value="1500">						
						<input type="hidden" class="current-max" value="100000">
			            <div class="ui-slider-range ui-widget-header ui-corner-all full" style="left: 0%; width: 100%;"></div>
			        </div>
			        <div class="clearfix"></div>
			    </div>
			</div>			
			<div class="sidebar-item mb-4">
				<div class="d-flex justify-content-center">
					<button class="nir-btn-default p-2 px-3 w-75 filter-button-flight" onclick="return filterButton();" data-bs-dismiss="modal">Filter</button>	
				</div>
			</div>
		</div>
	</div>
</body>	
</html>
