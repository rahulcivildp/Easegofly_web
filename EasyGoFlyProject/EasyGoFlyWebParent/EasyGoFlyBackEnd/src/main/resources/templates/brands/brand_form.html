<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: page_head('${pageTitle}', 'none')"></head>

		<!-- dynamic head ends -->


<body>
	<div class="main-wrapper">

		<!-- sidebar starts -->
    
		<div th:replace="navigation :: nav_sidebar"></div>



    <!-- sidebar Ends -->
	
		<div class="page-wrapper">
					
			<!-- navbar Starts -->

		<div th:replace="navigation :: nav_profile"></div>
			<!-- navbar Ends -->

      <!-- Page Content Starts -->
			<div class="page-content">


		<div>
			<h1>Manage Category | [[${pageTitle}]]</h1>
		</div>
		<form th:action="@{/brands/save}" method="post" style="max-width: 500px; margin: 0 auto;" th:object="${brand}" onsubmit="return(checkNameUnique(this))"  enctype="multipart/form-data">
			<input type="hidden" th:field="*{id}">
			<div class="border border-secondary rounded p-3">
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Brand Name:</label>
					<div class="col-sm-8">
						<input type="text" class="form-control" th:field="*{name}" required minlength="3" maxlength="128">
					</div> 
				</div>
				<br>
				<br>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Brand logo:</label>
					<div class="col-sm-8">
						<input type="hidden" th:field="*{logo}">
						<input type="file" name="fileImage" id="fileImage" accept="image/png, image/jpeg" class="mb-2"/>
						<div class="m-2">
							<img class="img-thumbnail img-fluid" id="thumbnail" th:src="@{${brand.photosImagePath}}" alt="Image Preview" style="max-width: 25% !important;"/>
						</div>
					</div> 
				</div>
				<br>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Parent Category:</label>
					<div class="col-sm-8">
						<select class="form-control" th:field="*{categories}" style="resize: vertical; height: 150px;" multiple required>
							<th:block th:each="cat : ${listCategories}">
								<option th:value="${cat.id}">[[${cat.name}]]</option>
							</th:block>
						</select>
					</div> 
				</div>
				<br>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Chosen categories:</label>
					<div class="col-sm-8">
						<div id="chosenCategories"></div>
					</div> 
				</div>
				
				<br>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Enabled:</label>
					<div class="col-sm-8">
						<input type="checkbox" th:field="*{enabled}" />
					</div> 
				</div>
				<br>
				<div class="text-center">
					<input type="submit" value="Save" class="btn btn-primary" id="myInput">
					<input type="button" value="Cancel" class="btn btn-secondary" id="buttonCancel">
				</div>
			</div>
		</form>







			</div>
      <!-- Page Content Ends -->

			<!-- footer Starts -->
      
		<div th:replace="fragments :: footer"></div>
      <!-- footer Ends -->
		
		</div>
	</div>

	
<script type="text/javascript">

	moduleURL = "[[@{/brands}]]";
	
	imageSize = 100;
	
	sizeScale = "KB";
	
	$(document).ready(function() {
		dropdownCategories = $("#categories");
		divChosenCategories = $("#chosenCategories");
		
		dropdownCategories.change(function() {
			divChosenCategories.empty();
			showChosenCategories();
		});
	});
	
	function showChosenCategories() {
		dropdownCategories.children("option:selected").each(function(){
			selectedCategory = $(this);
			catId = selectedCategory.val();
			catName = selectedCategory.text().replace(/-/g, "");
			
			divChosenCategories.append("<span class='badge bg-secondary m-1' >" + catName + "</span>");
		});
	};
	
	function checkNameUnique(form) {
		url = "[[@{/brands/check_name}]]";
		brandName = $("#name").val();
		brandId = $("#id").val();
		csrfVal = $("input[name='_csrf']").val();
		params = {id: brandId, name: brandName, _csrf: csrfVal};
			
		$.post(url, params, function(response) {
			if (response == "OK") {
				form.submit();
			} else if (response == "Duplicate Name") {
				alert("Warning: Duplicate name is provided: ** " + brandName + " **");
			} else {
				alert("Warning: Couldn't verify");
			}
		}).fail(function(){
			alert("Warning: Failed to save the request.");
		});
		
		return false;
	};
	
	
</script>
</body>
</html>
