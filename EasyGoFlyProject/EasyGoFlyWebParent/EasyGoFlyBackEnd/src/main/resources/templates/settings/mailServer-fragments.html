<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<div th:fragment="content" th:remove="tag">
		<form th:action="@{/settings/save_mail_server}" method="post">
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">SMTP Server HOST Name:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_HOST" th:value="${MAIL_HOST}" >
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Port Number:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_PORT" th:value="${MAIL_PORT}" >
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Username:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_USERNAME" th:value="${MAIL_USERNAME}" >
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Password:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_PASSWORD" th:value="${MAIL_PASSWORD}" >
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Server Authentication Required:</label>
				<div class="col-sm-10">
					<select name="SMTP_AUTH" class="form-control">
						<option th:selected="(${SMTP_AUTH} == 'true')" value="true">True</option>
						<option th:selected="(${SMTP_AUTH} == 'false')" value="false">False</option>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Server Required Secured Connection:</label>
				<div class="col-sm-10">
					<select name="SMTP_SECURED" class="form-control">
						<option th:selected="(${SMTP_SECURED} == 'true')" value="true">True</option>
						<option th:selected="(${SMTP_SECURED} == 'false')" value="false">False</option>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">From Email Address:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_FROM" th:value="${MAIL_FROM}" >
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Sender Name:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MAIL_SENDER_NAME" th:value="${MAIL_SENDER_NAME}" >
				</div>
			</div>
			
			<div class="text-center">
					<input type="submit" value="Save" class="btn btn-primary m-3" >
			</div>
		</form>
	</div>
	
</body>
</html>
