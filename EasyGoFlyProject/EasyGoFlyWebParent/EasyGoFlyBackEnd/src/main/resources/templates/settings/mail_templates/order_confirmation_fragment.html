<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<div th:fragment="content" th:remove="tag">
		<br>
		<div class="form-group row">
			<label class="col-sm-1 col-form-label">Email Subject:</label>
			<div class="col-sm-11">
				<input type="text" class="form-control" name="ORDER_CONFIRMATION_SUBJECT" th:value="${ORDER_CONFIRMATION_SUBJECT}" required="required">
			</div>
		</div>
		<br>
		<div class="form-group row">
			<label class="col-sm-1 col-form-label">Email Content:</label>
			<div class="col-sm-11">
				<textarea rows="5" class="form-control" name="ORDER_CONFIRMATION_CONTENT" id="ORDER_CONFIRMATION_CONTENT" required="required">[[${ORDER_CONFIRMATION_CONTENT}]]</textarea>
			</div>
		</div>
	</div>
	
</body>
</html>
