<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
	<head th:replace="fragments :: page_head('Settings page', 'tag')"></head>
	<link rel="stylesheet" th:href="@{/richtext/richtext.min.css}">
	<script th:src="@{/richtext/jquery.richtext.min.js}"></script>
</head>
<body>

	<div class="container-fluid">
		<div th:replace="navigation :: nav_menu"></div>
		
		<div>
			<h1 class="text-center m-3">Site Settings</h1>
		</div>
		<div th:if="${message != null}" class="alert alert-success text-center">
			[[${message}]]
		</div>
		<div>
			<ul class="nav nav-tabs" id="settingTab" role="tablist">
				<li class="nav-item">
					<a class="nav-link active" data-bs-toggle="tab" href="#general" role="tab">General</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="tab" href="#countries" role="tab">Countries</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="tab" href="#states" role="tab">States</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="tab" href="#mailServer" role="tab">Mail Server</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="tab" href="#mailTemplates" role="tab">Mail Templates</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="tab" href="#paymentGateway" role="tab">Payment Gateway</a>
				</li>
			</ul>
			
			<div class="tab-content">
				<div class="tab-pane active p-3" id="general" role="tabpanel">
					<div th:replace="settings/general-fragments :: content"></div>
				</div>
				<div class="tab-pane p-3" id="countries" role="tabpanel">
					<div th:replace="settings/country-fragments :: content"></div>
				</div>
				<div class="tab-pane p-3" id="states" role="tabpanel">
					<div th:replace="settings/state-fragments :: content"></div>
				</div>
				<div class="tab-pane p-3" id="mailServer" role="tabpanel">
					<div th:replace="settings/mailServer-fragments :: content"></div>
				</div>
				<div class="tab-pane p-3" id="mailTemplates" role="tabpanel">
					<div th:replace="settings/mail_templates/mail_templates-fragments :: content"></div>
				</div>
				<div class="tab-pane p-3" id="paymentGateway" role="tabpanel">
					<div th:replace="settings/payment-fragments :: content"></div>
				</div>
			</div>
		</div>
		<div class="toast justify-content-center" role="alert" aria-live="polite" aria-atomic="true" data-bs-delay="4000">
		  	<div role="alert" aria-live="assertive" aria-atomic="true">
				<div class="toast-body">
					<span id="toastMessage"></span>
				</div>
			</div>
		</div>
		
		<div th:replace="fragments :: footer"></div>
	</div>
	<script type="text/javascript" th:src="@{/js/states_setting.js}"></script>
	<script type="text/javascript" th:src="@{/js/common_form.js}"></script>
	<script type="text/javascript" th:src="@{/js/countries_setting.js}"></script>
	<script type="text/javascript">
	imageSize = 300;
	sizeScale = "MB";
	
	contextPath = "[[@{/}]]";
	var csrfHeaderName = "[[${_csrf.headerName}]]";
	var csrfValue = "[[${_csrf.token}]]";
	
	</script>
</body>

</html>
