<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
		
<body>
	<div th:fragment="content" th:remove="tag">
		<form th:action="@{/settings/save_api_service}" method="post">
			<h3>AIR IQ</h3>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">API Key:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="AIRIQ_API_KEY" th:value="${AIRIQ_API_KEY}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Username:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="AIRIQ_API_USERNAME" th:value="${AIRIQ_API_USERNAME}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Password:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="AIRIQ_API_PASSWORD" th:value="${AIRIQ_API_PASSWORD}" required="required">
				</div>
			</div>
			<br>
			<hr>
			<br>
			<h3>MASTER TRAVELS</h3>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">User IP:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MTRAVELS_API_USER_IP" th:value="${MTRAVELS_API_USER_IP}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">API Key:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MTRAVELS_API_KEY" th:value="${MTRAVELS_API_KEY}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">Token:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="MTRAVELS_FINAL_TOKEN" th:value="${MTRAVELS_FINAL_TOKEN}" required="required">
				</div>
			</div>
			<br>
			<hr>
			<br>
			<h3>EASE2FLY</h3>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">User Email:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="EASE2FLY_USERNAME" th:value="${EASE2FLY_USERNAME}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">User Password:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="EASE2FLY_PASSWORD" th:value="${EASE2FLY_PASSWORD}" required="required">
				</div>
			</div>
			<br>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">API Key:</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" name="EASE2FLY_API_KEY" th:value="${EASE2FLY_API_KEY}" required="required">
				</div>
			</div>
			<br>
			
			<div class="text-center">
					<input type="submit" value="Save" class="btn btn-primary m-3" >
			</div>
		</form>
	</div>
</body>

</html>
