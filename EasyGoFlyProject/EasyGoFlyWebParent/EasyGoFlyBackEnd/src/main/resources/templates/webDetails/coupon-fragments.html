<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
	<div th:fragment="content" th:remove="tag">
		<form th:action="@{/web_settings/save_coupon}" method="post">
			<div class="row">
				<div class="col-4"></div>
				<div class="col-4 row" style=" border: 3px solid #00862ca6; border-radius: 7px; padding: 10px;">
					<div class="col-12" style="text-align: center;">
						<h3>Add Coupon</h3>
					</div>
					<div class="col-5" style="justify-content: space-around; display: flex;">
						<label for="couponAmount" style="padding: 5px;">Coupon Amount:</label>
					</div>
					<div class="col-5" style="justify-content: space-around; display: flex;">
						<input type="text" id="couponAmount" name="couponAmount" style="width: 100%;">
					</div>
					<div class="col-2" style="justify-content: space-around; display: flex;">
						<input class="btn btn-success" type="submit" value="Save" style="font-weight: 600;">
					</div>
				</div>
			</div>
		</form>
		<br><br>
			<div style="border: 3px solid #4a7fe6; border-radius: 7px;">
				<h3 style="margin: 8px 22px; color: #0036a6; font-size: 30px; font-weight: 700;">Show Coupons</h3>
				
				
				<table class="table table-bordered table-hover tabel-responsive table-striped" style="text-align: center; margin: 0;">
					<thead class="table-dark">
						<tr>
							<th>Coupon Id</th>
							<th>Coupon Amount</th>
							<th>Coupon Code</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="coupon : ${coupons}">
							<td>[[${coupon.id}]]</td>
							<td>[[${coupon.couponAmount}]]</td>
							<td>[[${coupon.couponCode}]]</td>
						</tr>
					</tbody>
				</table>
			</div>
	</div>

</body>
</html>
