<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: page_head('Easegofly Admin Recharge History page', 'none')"></head>

		<!-- dynamic head ends -->
		
	<style type="text/css">
		.rowSuccess {
			    padding: 10px;
			    border: 1px solid grey;
			    border-radius: 7px;
			    background: #0080007a;
			    color: white;
			    margin: 5px 0;
		} 
		
		.rowCancel {
			    padding: 10px;
			    border: 1px solid grey;
			    border-radius: 7px;
			    background: #80000042;
			    color: white;
			    margin: 5px 0;
		} 
	
	</style>


<body>
	<div class="main-wrapper">

		<!-- sidebar starts -->
    
		<div th:replace="navigation :: nav_sidebar"></div>



    <!-- sidebar Ends -->
	
		<div class="page-wrapper">
					
			<!-- navbar Starts -->

		<div th:replace="navigation :: nav_profile"></div>
			<!-- navbar Ends -->

      <!-- Page Content Starts -->
			<div class="page-content">

<div class="container" style="border: 3px solid #848cea; border-radius: 8px; margin-bottom: 20px; margin-top: 30px; box-shadow: rgb(0 0 0 / 25%) 0px 10px 20px, rgb(0 0 0 / 40%) 0px 10px 20px; padding: 20px;">
	<h2>Recharge History:</h2>
	<th:block th:each="rechargeHistory : ${rechargeHistories}">
		<div th:class="${rechargeHistory.rechargeHistoryStatus} == ${rechargeStatus} ? 'row rowSuccess' : 'row rowCancel'">
			<div class="col-2">Date: [[${rechargeHistory.date}]]</div>
			<div class="col-2"></div>
			<div class="col-2">TRN ID: [[${rechargeHistory.transaction}]]</div>
			<div class="col-2" th:id="'rechargeAmount' + ${rechargeHistory.id}"></div>
			<div class="col-2"></div>
			<div class="col-2">Status: [[${rechargeHistory.rechargeHistoryStatus}]]</div>
		</div>
		<script type="text/javascript">
			rechargeAmount = [[${rechargeHistory.rechargeAmount}]] / 100;
			rechargeAmountString = "Rs. " + rechargeAmount + " INR";
			$("#rechargeAmount" + [[${rechargeHistory.id}]]).text(rechargeAmountString);
		</script>
	</th:block>
</div>
 






			</div>
      <!-- Page Content Ends -->

			<!-- footer Starts -->
      
		<div th:replace="fragments :: footer"></div>
      <!-- footer Ends -->
		
		</div>
	</div>


</body>
</html>
